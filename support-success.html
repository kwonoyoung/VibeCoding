<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>후원 결제 확인</title>
<script src="support-config.js"></script>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f2f7f9;color:#173042;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.box{width:min(520px,100%);padding:28px;border:1px solid #d9e5ea;border-radius:22px;background:#fff;box-shadow:0 18px 44px rgba(20,54,75,.11);text-align:center}.ico{font-size:44px}.box h1{margin:12px 0 8px;font-size:24px}.box p{margin:0;color:#657c89;font-size:13px;line-height:1.7}.amount{margin:18px 0;padding:15px;border-radius:14px;background:#f1f8fa;font-size:23px;font-weight:950;color:#0b5578}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.actions a{padding:11px 16px;border-radius:11px;text-decoration:none;font-weight:900;font-size:13px}.primary{background:#0e5d7f;color:#fff}.secondary{background:#edf3f6;color:#345366}.error{color:#a13d48!important}</style>
</head>
<body><main class="box"><div class="ico" id="ico">⏳</div><h1 id="title">결제를 확인하고 있습니다</h1><p id="message">결제 승인 결과를 확인하는 중입니다.</p><div class="amount" id="amount">-</div><div class="actions"><a class="primary" href="index.html">메인으로</a><a class="secondary" href="support.html">다시 후원하기</a></div></main>
<script>
const q=new URLSearchParams(location.search),paymentKey=q.get('paymentKey'),orderId=q.get('orderId'),amount=Number(q.get('amount'));
const amountEl=document.getElementById('amount'),titleEl=document.getElementById('title'),messageEl=document.getElementById('message'),ico=document.getElementById('ico');
amountEl.textContent=Number.isFinite(amount)?amount.toLocaleString('ko-KR')+'원':'금액 확인 필요';
async function confirmPayment(){
  const saved=JSON.parse(sessionStorage.getItem('supportOrder')||'null');
  if(!paymentKey||!orderId||!Number.isFinite(amount)){throw new Error('결제 결과 정보가 올바르지 않습니다.')}
  if(saved&&(saved.orderId!==orderId||Number(saved.amount)!==amount)){throw new Error('결제 요청 금액 또는 주문번호가 일치하지 않습니다.')}
  const endpoint=window.SUPPORT_CONFIG&&window.SUPPORT_CONFIG.confirmEndpoint;
  if(!endpoint)throw new Error('결제 승인 서버 주소가 설정되지 않았습니다.');
  const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paymentKey,orderId,amount})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(data.message||data.error||'결제 승인에 실패했습니다.');
  sessionStorage.removeItem('supportOrder');
  ico.textContent='💛';titleEl.textContent='후원해 주셔서 감사합니다';messageEl.textContent='결제가 정상적으로 완료되었습니다. 보내주신 후원은 서비스 운영과 개선에 소중히 사용하겠습니다.';
}
confirmPayment().catch(err=>{console.error(err);ico.textContent='⚠️';titleEl.textContent='결제 승인 확인이 필요합니다';messageEl.textContent=err.message||'결제 승인 중 오류가 발생했습니다.';messageEl.classList.add('error')});
</script></body></html>
