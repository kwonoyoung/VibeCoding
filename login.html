<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>회원 로그인 | 오춘기 권오영 업무지원 서비스</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:linear-gradient(135deg,#eaf4f7,#f8fbfc);color:#183448}.box{width:min(460px,100%);background:#fff;border:1px solid #d7e4ea;border-radius:24px;box-shadow:0 20px 60px rgba(7,54,82,.14);overflow:hidden}.head{padding:28px 30px;color:#fff;background:linear-gradient(135deg,#082f4d,#0e5d7f 62%,#0c9488)}.head h1{margin:0;font-size:25px}.head p{margin:8px 0 0;color:#d6edf0;font-size:13px;line-height:1.6}.body{padding:26px 30px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.tab{padding:11px;border:1px solid #d7e4ea;border-radius:11px;background:#f7fafb;cursor:pointer;font-weight:800;color:#577080}.tab.on{background:#0e5d7f;color:#fff;border-color:#0e5d7f}.field{margin:13px 0}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:800}.required{color:#d04444;margin-left:3px}.field input{width:100%;padding:12px 13px;border:1px solid #cadbe4;border-radius:11px;font-size:15px;outline:none}.field input:focus{border-color:#0c9488;box-shadow:0 0 0 3px rgba(12,148,136,.12)}.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#0b3c5d,#0c9488);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.subbtn{width:100%;margin-top:9px;padding:11px;border:1px solid #bdd3dc;border-radius:11px;background:#f5fafb;color:#315767;font-weight:850;cursor:pointer}.msg{display:none;margin-top:14px;padding:12px 13px;border-radius:10px;background:#eef7f7;color:#275b5a;font-size:13px;line-height:1.6}.msg.show{display:block}.msg.err{background:#fff2f2;color:#8a3434}.back{display:block;margin-top:18px;text-align:center;color:#617988;text-decoration:none;font-size:13px;font-weight:700}.small{margin-top:12px;color:#778b97;font-size:12px;line-height:1.55}.hidden{display:none}</style>
</head><body>
<div class="box"><div class="head"><h1>회원 전용 업무지원 서비스</h1><p>관리자 승인을 받은 회원만 업무 도구를 이용할 수 있습니다.</p></div><div class="body">
<div class="tabs"><button class="tab on" id="loginTab">로그인</button><button class="tab" id="signupTab">회원가입</button></div>
<div id="loginForm"><div class="field"><label>이메일</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>비밀번호</label><input id="loginPw" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">로그인</button></div>
<div id="signupForm" class="hidden">
  <div class="field"><label>아이디(이메일주소)<span class="required">*</span></label><input id="email" type="email" autocomplete="email" required placeholder="example@email.com"></div>
  <div class="field"><label>비밀번호<span class="required">*</span></label><input id="pw" type="password" minlength="8" autocomplete="new-password" required placeholder="8자 이상"></div>
  <div class="field"><label>비밀번호 재확인<span class="required">*</span></label><input id="pwConfirm" type="password" minlength="8" autocomplete="new-password" required placeholder="비밀번호를 다시 입력"></div>
  <div class="field"><label>이름<span class="required">*</span></label><input id="name" type="text" autocomplete="name" required placeholder="이름 입력"></div>
  <div class="field"><label>기관명<span class="required">*</span></label><input id="institution" type="text" required placeholder="소속 기관명 입력"></div>
  <button class="btn" id="signupBtn">회원가입 신청</button><button class="subbtn" id="resendBtn" type="button">인증메일 다시 보내기</button><div class="small">모든 항목은 필수입니다. 일반 회원은 가입 → 이메일 인증 → 관리자 승인 순서로 이용할 수 있습니다. 인증메일 재요청은 보안상 약 60초 간격으로 제한될 수 있습니다.</div></div>
<div id="msg" class="msg"></div><a class="back" href="index.html">← 홈으로 돌아가기</a></div></div>
<script>
const sb=supabase.createClient('https://eqpiuszmgrwituwprgdc.supabase.co','sb_publishable_SN2iYw3cBqstKGIS3NdoTw_5ghetwqQ');
const $=id=>document.getElementById(id),qs=new URLSearchParams(location.search);
function show(t,err=false){$('msg').textContent=t;$('msg').className='msg show'+(err?' err':'')}
function safeReturn(){const raw=qs.get('return');if(!raw)return 'index.html';try{const u=new URL(raw,location.href);if(u.origin!==location.origin||!u.pathname.startsWith('/VibeCoding/'))return 'index.html';if(/\/(login|admin(?:-login)?)\.html$/i.test(u.pathname))return 'index.html';return u.href;}catch{return 'index.html';}}
function tab(signup){$('loginTab').classList.toggle('on',!signup);$('signupTab').classList.toggle('on',signup);$('loginForm').classList.toggle('hidden',signup);$('signupForm').classList.toggle('hidden',!signup);$('msg').classList.remove('show')}
function rateLimited(error){const s=(error?.message||'').toLowerCase();return s.includes('security purposes')||s.includes('after')&&s.includes('seconds')||error?.status===429;}
function startCooldown(btn,sec=60){btn.disabled=true;let n=sec;const original=btn.textContent;btn.textContent=`${n}초 후 다시 시도`;const timer=setInterval(()=>{n--;btn.textContent=n>0?`${n}초 후 다시 시도`:original;if(n<=0){clearInterval(timer);btn.disabled=false}},1000)}
$('loginTab').onclick=()=>tab(false);$('signupTab').onclick=()=>tab(true);if(qs.get('mode')==='signup')tab(true);
$('loginBtn').onclick=async()=>{const email=$('loginEmail').value.trim(),password=$('loginPw').value;if(!email||!password)return show('이메일과 비밀번호를 입력해 주세요.',true);$('loginBtn').disabled=true;const {data,error}=await sb.auth.signInWithPassword({email,password});$('loginBtn').disabled=false;if(error)return show('로그인 실패: 이메일 인증 여부와 비밀번호를 확인해 주세요.',true);const {data:m,error:me}=await sb.from('vibecoding_members').select('role,status').eq('user_id',data.user.id).single();if(me)return show('회원 정보를 확인하지 못했습니다.',true);if(m.status==='approved')location.replace(safeReturn());else if(m.status==='pending')show('로그인은 확인되었습니다. 현재 관리자 승인 대기 중입니다.');else show('현재 차단된 계정입니다. 관리자에게 문의해 주세요.',true)};
$('signupBtn').onclick=async()=>{
  const email=$('email').value.trim();
  const password=$('pw').value;
  const passwordConfirm=$('pwConfirm').value;
  const display_name=$('name').value.trim();
  const institution=$('institution').value.trim();
  if(!email||!password||!passwordConfirm||!display_name||!institution)return show('아이디(이메일주소), 비밀번호, 비밀번호 재확인, 이름, 기관명을 모두 입력해 주세요.',true);
  if(password.length<8)return show('비밀번호는 8자 이상으로 설정해 주세요.',true);
  if(password!==passwordConfirm)return show('비밀번호와 비밀번호 재확인이 일치하지 않습니다.',true);
  const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailPattern.test(email))return show('올바른 이메일 주소를 입력해 주세요.',true);
  const redirect='https://kwonoyoung.github.io/VibeCoding/login.html'+(qs.get('return')?'?return='+encodeURIComponent(safeReturn()):'');
  $('signupBtn').disabled=true;
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name,institution},emailRedirectTo:redirect}});
  if(error){$('signupBtn').disabled=false;if(rateLimited(error)){startCooldown($('signupBtn'),60);return show('회원가입 요청이 이미 접수되었거나 인증메일을 방금 요청했습니다. 약 60초 후 [인증메일 다시 보내기]를 눌러 주세요.');}return show('회원가입 처리 중 오류가 발생했습니다: '+error.message,true)}
  if(data?.user){show(data.session?'회원가입이 완료되었습니다. 관리자 승인 후 이용할 수 있습니다.':'회원가입 신청이 접수되었습니다. 받은 이메일의 인증 링크를 누른 뒤 관리자 승인을 기다려 주세요.');startCooldown($('signupBtn'),60)}else{$('signupBtn').disabled=false;show('회원가입 요청을 확인하지 못했습니다. 잠시 후 다시 시도해 주세요.',true)}
};
$('resendBtn').onclick=async()=>{const email=$('email').value.trim();if(!email)return show('인증메일을 받을 이메일 주소를 먼저 입력해 주세요.',true);const redirect='https://kwonoyoung.github.io/VibeCoding/login.html'+(qs.get('return')?'?return='+encodeURIComponent(safeReturn()):'');$('resendBtn').disabled=true;const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:redirect}});if(error){$('resendBtn').disabled=false;if(rateLimited(error)){startCooldown($('resendBtn'),60);return show('보안상 인증메일은 연속으로 보낼 수 없습니다. 약 60초 후 다시 시도해 주세요.');}return show('인증메일 재전송 실패: '+error.message,true)}show('인증메일을 다시 보냈습니다. 받은편지함과 스팸함을 확인해 주세요.');startCooldown($('resendBtn'),60)};
</script></body></html>
