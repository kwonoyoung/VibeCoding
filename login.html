<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>회원 로그인 | 오춘기 권오영 업무지원 서비스</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:linear-gradient(135deg,#eaf4f7,#f8fbfc);color:#183448}.box{width:min(460px,calc(100% - 28px));background:#fff;border:1px solid #d7e4ea;border-radius:24px;box-shadow:0 20px 60px rgba(7,54,82,.14);overflow:hidden}.head{padding:28px 30px;color:#fff;background:linear-gradient(135deg,#082f4d,#0e5d7f 62%,#0c9488)}.head h1{margin:0;font-size:25px}.head p{margin:8px 0 0;color:#d6edf0;font-size:13px;line-height:1.6}.body{padding:26px 30px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.tab{padding:11px;border:1px solid #d7e4ea;border-radius:11px;background:#f7fafb;cursor:pointer;font-weight:800;color:#577080}.tab.on{background:#0e5d7f;color:#fff;border-color:#0e5d7f}.field{margin:13px 0}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:800}.field input{width:100%;padding:12px 13px;border:1px solid #cadbe4;border-radius:11px;font-size:15px;outline:none}.field input:focus{border-color:#0c9488;box-shadow:0 0 0 3px rgba(12,148,136,.12)}.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#0b3c5d,#0c9488);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.msg{display:none;margin-top:14px;padding:12px 13px;border-radius:10px;background:#eef7f7;color:#275b5a;font-size:13px;line-height:1.6}.msg.show{display:block}.back{display:block;margin-top:18px;text-align:center;color:#617988;text-decoration:none;font-size:13px;font-weight:700}.small{margin-top:12px;color:#778b97;font-size:12px;line-height:1.55}.hidden{display:none}</style>
</head><body>
<div class="box"><div class="head"><h1>회원 전용 업무지원 서비스</h1><p>관리자 승인을 받은 회원만 업무 도구를 이용할 수 있습니다.</p></div><div class="body">
<div class="tabs"><button class="tab on" id="loginTab">로그인</button><button class="tab" id="signupTab">회원가입</button></div>
<div id="loginForm"><div class="field"><label>이메일</label><input id="loginEmail" type="email" autocomplete="email"></div><div class="field"><label>비밀번호</label><input id="loginPw" type="password" autocomplete="current-password"></div><button class="btn" id="loginBtn">로그인</button></div>
<div id="signupForm" class="hidden"><div class="field"><label>성명</label><input id="name" type="text"></div><div class="field"><label>이메일</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>비밀번호</label><input id="pw" type="password" minlength="6" autocomplete="new-password"></div><button class="btn" id="signupBtn">회원가입 신청</button><div class="small">일반 회원은 가입 및 이메일 확인 후 관리자 승인이 필요합니다.</div></div>
<div id="msg" class="msg"></div><a class="back" href="index.html">← 홈으로 돌아가기</a></div></div>
<script>
const sb=supabase.createClient('https://eqpiuszmgrwituwprgdc.supabase.co','sb_publishable_SN2iYw3cBqstKGIS3NdoTw_5ghetwqQ');
const $=id=>document.getElementById(id),msg=t=>{$('msg').textContent=t;$('msg').classList.add('show')};
const qs=new URLSearchParams(location.search);
function safeReturn(){const raw=qs.get('return');if(!raw)return 'index.html';try{const u=new URL(raw,location.href);if(u.origin!==location.origin||!u.pathname.startsWith('/VibeCoding/'))return 'index.html';if(/\/(login|admin)\.html$/i.test(u.pathname))return 'index.html';return u.href;}catch{return 'index.html';}}
function tab(signup){$('loginTab').classList.toggle('on',!signup);$('signupTab').classList.toggle('on',signup);$('loginForm').classList.toggle('hidden',signup);$('signupForm').classList.toggle('hidden',!signup);$('msg').classList.remove('show')}
$('loginTab').onclick=()=>tab(false);$('signupTab').onclick=()=>tab(true);if(qs.get('mode')==='signup')tab(true);
$('loginBtn').onclick=async()=>{const email=$('loginEmail').value.trim(),password=$('loginPw').value;if(!email||!password)return msg('이메일과 비밀번호를 입력해 주세요.');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)return msg('로그인 실패: '+error.message);const {data:m,error:me}=await sb.from('vibecoding_members').select('role,status').eq('user_id',data.user.id).single();if(me)return msg('회원 정보를 확인하지 못했습니다.');if(m.status==='approved'){location.replace(safeReturn());}else if(m.status==='pending')msg('회원가입은 완료되었으며 현재 관리자 승인 대기 중입니다.');else msg('현재 차단된 계정입니다. 관리자에게 문의해 주세요.');};
$('signupBtn').onclick=async()=>{const display_name=$('name').value.trim(),email=$('email').value.trim(),password=$('pw').value;if(!display_name||!email||password.length<6)return msg('성명·이메일을 입력하고 비밀번호는 6자 이상으로 설정해 주세요.');const redirect='https://kwonoyoung.github.io/VibeCoding/login.html'+(qs.get('return')?'?return='+encodeURIComponent(safeReturn()):'');const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name},emailRedirectTo:redirect}});if(error)return msg('회원가입 실패: '+error.message);if(data.session){msg(email.toLowerCase()==='kwonoyoung77@gmail.com'?'관리자 계정 가입이 완료되었습니다.':'회원가입이 완료되었습니다. 관리자 승인 후 이용할 수 있습니다.');}else msg('회원가입이 접수되었습니다. 이메일 인증 후 관리자 승인을 받아야 이용할 수 있습니다.');};
</script></body></html>
