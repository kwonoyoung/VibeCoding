<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>관리자 로그인 | 오춘기 권오영 업무지원 서비스</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:radial-gradient(circle at 12% 10%,rgba(12,148,136,.13),transparent 27%),linear-gradient(135deg,#eaf4f7,#f8fbfc);color:#183448}.box{width:min(480px,100%);overflow:hidden;border:1px solid #d7e4ea;border-radius:25px;background:#fff;box-shadow:0 22px 65px rgba(7,54,82,.15)}.head{padding:30px;color:#fff;background:linear-gradient(135deg,#082f4d,#0e5d7f 62%,#0c9488)}.badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;padding:7px 11px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.12);font-size:11px;font-weight:900}.badge:before{content:"";width:7px;height:7px;border-radius:50%;background:#63ded4}.head h1{margin:0;font-size:27px;letter-spacing:-.045em}.head p{margin:10px 0 0;color:#d6edf0;font-size:13px;line-height:1.7}.body{padding:28px 30px}.label{margin:0 0 7px;font-size:12px;font-weight:900;color:#526c7b}.email{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid #cddde5;border-radius:12px;background:#f7fafb;color:#24475d;font-size:14px;font-weight:850;word-break:break-all}.email:before{content:"✉";font-size:18px}.field{margin-top:17px}.pw-wrap{display:flex;align-items:center;border:1px solid #cddde5;border-radius:12px;background:#fff;overflow:hidden}.pw-wrap:focus-within{border-color:#0c9488;box-shadow:0 0 0 3px rgba(12,148,136,.12)}.pw-wrap input{flex:1;min-width:0;padding:14px;border:0;outline:0;font-size:15px;color:#183448;background:transparent}.pw-wrap button{flex:0 0 auto;border:0;background:transparent;padding:0 14px;color:#547181;font-weight:800;cursor:pointer}.btn{width:100%;margin-top:19px;padding:13px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,#0b3c5d,#0c9488);color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 9px 22px rgba(12,148,136,.17)}.btn:disabled{opacity:.55;cursor:not-allowed}.msg{display:none;margin-top:15px;padding:13px;border-radius:11px;background:#eef7f7;color:#275b5a;font-size:13px;line-height:1.65}.msg.show{display:block}.warn{margin-top:16px;padding:12px 13px;border:1px solid #e6e0c8;border-radius:11px;background:#fffaf0;color:#76612d;font-size:12px;line-height:1.65}.back{display:block;margin-top:19px;text-align:center;color:#617988;text-decoration:none;font-size:13px;font-weight:800}.loading{display:none;margin:14px auto 0;width:28px;height:28px;border:3px solid #d9e8eb;border-top-color:#0c9488;border-radius:50%;animation:s .8s linear infinite}.loading.on{display:block}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="box">
  <section class="head"><div class="badge">ADMIN SECURE LOGIN</div><h1>관리자 로그인</h1><p>이메일 발송 없이 등록된 관리자 계정의 비밀번호로 바로 로그인합니다.</p></section>
  <section class="body">
    <div class="label">관리자 이메일</div>
    <div class="email">kwonoyoung77@gmail.com</div>
    <div class="field">
      <div class="label">관리자 비밀번호</div>
      <div class="pw-wrap"><input type="password" id="password" autocomplete="current-password" placeholder="관리자 비밀번호를 입력하세요"><button type="button" id="togglePw">보기</button></div>
    </div>
    <button class="btn" id="loginBtn">관리자 로그인</button>
    <div class="loading" id="loading"></div>
    <div class="msg" id="msg"></div>
    <div class="warn">관리자 계정은 <strong>kwonoyoung77@gmail.com</strong>으로 고정되어 있습니다. 로그인 성공 후에도 관리자 권한과 승인 상태를 다시 확인합니다.</div>
    <a class="back" href="index.html">← 첫 화면으로 돌아가기</a>
  </section>
</main>
<script>
const SUPABASE_URL='https://eqpiuszmgrwituwprgdc.supabase.co';
const SUPABASE_KEY='sb_publishable_SN2iYw3cBqstKGIS3NdoTw_5ghetwqQ';
const ADMIN_EMAIL='kwonoyoung77@gmail.com';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loginBtn=document.getElementById('loginBtn');
const password=document.getElementById('password');
const togglePw=document.getElementById('togglePw');
const msg=document.getElementById('msg');
const loading=document.getElementById('loading');
let processing=false;
function show(t,bad=false){msg.textContent=t;msg.classList.add('show');msg.style.background=bad?'#fff0f1':'#eef7f7';msg.style.color=bad?'#922f39':'#275b5a'}
async function verifyAdmin(session){
  if(!session)return false;
  if((session.user?.email||'').toLowerCase()!==ADMIN_EMAIL){await sb.auth.signOut();show('관리자 계정이 아닙니다.',true);return false;}
  const {data:m,error}=await sb.from('vibecoding_members').select('role,status').eq('user_id',session.user.id).single();
  if(error||!m||m.role!=='admin'||m.status!=='approved'){await sb.auth.signOut();show('관리자 권한 또는 승인 상태를 확인하지 못했습니다.',true);return false;}
  location.replace('admin.html');
  return true;
}
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    if((session.user?.email||'').toLowerCase()===ADMIN_EMAIL) await verifyAdmin(session);
    else await sb.auth.signOut();
  }
})();
async function doLogin(){
  if(processing)return;
  const pw=password.value;
  if(!pw){show('관리자 비밀번호를 입력해 주세요.',true);password.focus();return;}
  processing=true;loginBtn.disabled=true;loading.classList.add('on');msg.classList.remove('show');
  try{
    await sb.auth.signOut();
    const {data,error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:pw});
    if(error){
      const m=(error.message||'').toLowerCase();
      if(m.includes('invalid login credentials')) show('관리자 비밀번호가 올바르지 않습니다.',true);
      else show('관리자 로그인에 실패했습니다: '+error.message,true);
      return;
    }
    await verifyAdmin(data.session);
  }finally{processing=false;loginBtn.disabled=false;loading.classList.remove('on')}
}
loginBtn.addEventListener('click',doLogin);
password.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
togglePw.addEventListener('click',()=>{const isPw=password.type==='password';password.type=isPw?'text':'password';togglePw.textContent=isPw?'숨기기':'보기'});
</script>
</body>
</html>
