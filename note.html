<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0b5578">
  <title>오춘기노트 | 오춘기 권오영 업무지원 서비스</title>
  <style>
    :root{--navy:#0b3c5d;--navy2:#0e5d7f;--teal:#0c9488;--ink:#173042;--muted:#6c7f8c;--line:#dce6eb;--soft:#f4f8fa;--card:#fff;--shadow:0 12px 34px rgba(17,54,78,.08)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:linear-gradient(180deg,#eef6f8 0,#f7f9fa 260px,#f3f6f8 100%);letter-spacing:-.02em}
    a{color:inherit}.top{background:linear-gradient(128deg,#082f4d,#0d5879 58%,#0b8b82);color:#fff}.top-inner{width:min(1100px,calc(100% - 32px));margin:auto;padding:26px 0 34px}.home-link{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid rgba(255,255,255,.38);border-radius:999px;background:rgba(255,255,255,.12);color:#fff;text-decoration:none;font-size:12px;font-weight:900;transition:.16s}.home-link:hover{transform:translateY(-1px);background:rgba(255,255,255,.2)}
    .brand{margin-top:30px}.brand-kicker{font-size:11px;font-weight:900;letter-spacing:.12em;color:#bce6e1}.brand h1{margin:7px 0 8px;font-size:clamp(30px,4vw,42px);line-height:1.15}.brand p{margin:0;color:#d7edf1;font-size:14px;line-height:1.7}
    .wrap{width:min(1100px,calc(100% - 32px));margin:auto;padding:28px 0 56px}.search-box{padding:20px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.94);box-shadow:var(--shadow)}.search-row{display:grid;grid-template-columns:220px 1fr;gap:12px}.field label{display:block;margin:0 0 7px;font-size:12px;font-weight:900;color:#526a78}.field select,.field input{width:100%;height:46px;padding:0 14px;border:1px solid #cddce4;border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-size:14px;outline:none}.field select:focus,.field input:focus{border-color:#0c9488;box-shadow:0 0 0 3px rgba(12,148,136,.12)}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 2px 10px}.toolbar h2{margin:0;font-size:19px}.count{display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:7px 10px;border-radius:999px;background:#e7f5f3;color:#0a7b72;font-size:12px;font-weight:900}
    .table-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}.head,.note-row{display:grid;grid-template-columns:160px 1fr 130px;align-items:center;gap:12px}.head{padding:13px 18px;background:#edf4f7;color:#5c7280;font-size:12px;font-weight:900}.note-row{padding:17px 18px;border-top:1px solid #edf1f4;cursor:pointer;transition:.15s}.note-row:hover{background:#f8fbfc}.category{display:inline-flex;width:max-content;max-width:100%;padding:6px 9px;border-radius:999px;background:#edf4f8;color:#315d76;font-size:11px;font-weight:900}.note-title{font-size:14px;font-weight:900;line-height:1.45}.note-sub{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.5}.date{text-align:right;color:#71838e;font-size:12px;font-weight:700}.empty{display:none;padding:42px 20px;text-align:center;color:#7a8d98;font-size:14px}
    .detail{display:none;margin-top:18px;padding:24px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)}.detail.show{display:block}.detail-top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.detail h3{margin:7px 0 8px;font-size:22px}.detail p{margin:0;color:#5e7380;line-height:1.75;font-size:14px}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.detail-actions a,.detail-actions button{padding:9px 13px;border:0;border-radius:10px;text-decoration:none;font-weight:900;font-size:12px;cursor:pointer}.source-btn{background:#0e5d7f;color:#fff}.close-btn{background:#edf3f6;color:#345366}.notice{margin-top:16px;padding:13px 15px;border-radius:13px;background:#fff8e8;color:#7c621f;font-size:12px;line-height:1.6}
    .footer{margin-top:28px;text-align:center;color:#82929c;font-size:11px}
    @media(max-width:720px){.top-inner,.wrap{width:min(100% - 22px,1100px)}.search-row{grid-template-columns:1fr}.head{display:none}.note-row{grid-template-columns:1fr;gap:8px}.date{text-align:left}.detail-top{display:block}.brand{margin-top:24px}}
  </style>
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="home-link" href="index.html" aria-label="홈으로 이동"><span aria-hidden="true">⌂</span><span>홈</span></a>
      <div class="brand">
        <div class="brand-kicker">OCHUNGI NOTE</div>
        <h1>오춘기노트</h1>
        <p>교육행정 실무 노트를 분류와 검색으로 빠르게 찾아보세요.</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="search-box" aria-label="노트 검색">
      <div class="search-row">
        <div class="field">
          <label for="category">분류 검색</label>
          <select id="category">
            <option value="">전체 분류</option>
          </select>
        </div>
        <div class="field">
          <label for="keyword">노트 검색</label>
          <input id="keyword" type="search" placeholder="노트 제목 또는 요약 검색" autocomplete="off">
        </div>
      </div>
    </section>

    <div class="toolbar">
      <h2>노트 목록</h2>
      <span class="count" id="count">0개</span>
    </div>

    <section class="table-card" aria-live="polite">
      <div class="head"><div>분류</div><div>노트명</div><div style="text-align:right">수정일자</div></div>
      <div id="list"></div>
      <div class="empty" id="empty">검색 조건에 맞는 노트가 없습니다.</div>
    </section>

    <section class="detail" id="detail" aria-label="노트 미리보기">
      <div class="detail-top">
        <div>
          <span class="category" id="detailCategory"></span>
          <h3 id="detailTitle"></h3>
          <p id="detailSummary"></p>
        </div>
        <div class="date" id="detailDate"></div>
      </div>
      <div class="detail-actions">
        <a class="source-btn" id="sourceLink" href="#" target="_blank" rel="noopener noreferrer">원문 보기</a>
        <button class="close-btn" id="closeDetail" type="button">닫기</button>
      </div>
      <div class="notice">이 페이지는 iframe 없이 독립적으로 동작합니다. 노트 본문 전문은 저작권 보호를 위해 원문 페이지에서 확인하도록 연결했습니다.</div>
    </section>

    <div class="footer">오춘기 권오영 업무지원 서비스 · 오춘기노트</div>
  </main>

  <script>
  const notes=[
    {category:'지출·회계',title:'여비 (관내여비, 관외여비)',date:'2026.06.08',summary:'공무원 출장에 따른 관내·관외 여비 산정과 K-에듀파인 처리 흐름을 확인하는 실무 노트입니다.',url:'https://gyohaeng.pages.dev/note/notes/expenditure/yeobi'},
    {category:'지출·회계',title:'지출 과목경정',date:'2026',summary:'지출 완료 후 잘못 적용된 예산과목을 정당한 과목으로 바로잡는 처리 기준을 살펴봅니다.',url:'https://gyohaeng.pages.dev/note/notes/expenditure/budget_correction'},
    {category:'문서',title:'타인이 기안한 발송대기 문서 발송처리',date:'2026.06.20',summary:'처리과문서담당자가 부서 내 발송대기 문서를 조회하고 발송하는 절차를 정리한 노트입니다.',url:'https://gyohaeng.pages.dev/note/notes/docu/document_send'},
    {category:'문서',title:'에듀파인 공문서 작성(기안)',date:'2026.06.07',summary:'K-에듀파인에서 일반 공문서와 재정문서를 기안하고 결재 상신할 때 확인할 흐름을 다룹니다.',url:'https://gyohaeng.pages.dev/note/notes/docu/document_draft'},
    {category:'인증서',title:'인증서 발급 및 갱신 관리',date:'2026.06.07',summary:'교육행정 전자서명 인증서와 기관 공동인증서의 발급·갱신·이동 및 관리 절차를 살펴봅니다.',url:'https://gyohaeng.pages.dev/note/notes/new/gpki'},
    {category:'물품',title:'물품의 취득',date:'2026.06.09',summary:'구매·기증 등으로 취득한 물품을 K-에듀파인 자산 대장에 반영하는 업무 흐름을 정리합니다.',url:'https://gyohaeng.pages.dev/note/notes/mulpum/mulpum_get'},
    {category:'계약',title:'S2B 물품계약 (1인 수의)',date:'2026.07.06',summary:'K-에듀파인 계약방법결정과 학교장터 S2B의 1인 수의계약 절차를 연결해서 확인합니다.',url:'https://gyohaeng.pages.dev/note/notes/contract/s2b_1p_mulpum'},
    {category:'교특회계',title:'목적사업비 학교 교부',date:'2026',summary:'교육청·교육지원청의 목적사업비 교부부터 학교회계 세입 처리까지의 흐름을 살펴봅니다.',url:'https://gyohaeng.pages.dev/note/notes/special_account/categorical_funding'},
    {category:'교특회계',title:'교특회계 지출 흐름 파악하기',date:'2026.06.20',summary:'지출품의부터 원인행위, 검사검수, 자금 배정, 지출결의와 지급명령까지 전체 흐름을 정리합니다.',url:'https://gyohaeng.pages.dev/note/notes/special_account/expenditure_process'},
    {category:'지출·회계',title:'원인행위 조정결의',date:'2026.06.11',summary:'이미 결재된 원인행위 금액을 증액 또는 감액해야 할 때의 처리 기준과 절차를 확인합니다.',url:'https://gyohaeng.pages.dev/note/notes/expenditure/commitment_adjustment'},
    {category:'교특회계',title:'예산 재배정 및 학교 교부',date:'2026.06.05',summary:'교육비특별회계 예산의 재배정과 학교 교부 업무에서 확인할 기준과 관련 흐름을 살펴봅니다.',url:'https://gyohaeng.pages.dev/note/notes/special_account/budget_allocation'},
    {category:'교특회계',title:'재배정 예산 반납',date:'2026.06.12',summary:'재배정 받은 예산의 집행잔액을 반납하는 절차와 시스템 처리 시 유의사항을 정리합니다.',url:'https://gyohaeng.pages.dev/note/notes/special_account/budget_reallocation'}
  ];

  const category=document.getElementById('category');
  const keyword=document.getElementById('keyword');
  const list=document.getElementById('list');
  const count=document.getElementById('count');
  const empty=document.getElementById('empty');
  const detail=document.getElementById('detail');
  const categories=[...new Set(notes.map(n=>n.category))].sort((a,b)=>a.localeCompare(b,'ko'));
  categories.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;category.appendChild(o)});

  function esc(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
  function render(){
    const c=category.value;
    const q=keyword.value.trim().toLowerCase();
    const rows=notes.filter(n=>(!c||n.category===c)&&(!q||(n.title+' '+n.summary+' '+n.category).toLowerCase().includes(q)));
    count.textContent=rows.length+'개';
    list.innerHTML=rows.map((n,i)=>`<article class="note-row" role="button" tabindex="0" data-index="${notes.indexOf(n)}"><div><span class="category">${esc(n.category)}</span></div><div><div class="note-title">${esc(n.title)}</div><div class="note-sub">${esc(n.summary)}</div></div><div class="date">${esc(n.date)}</div></article>`).join('');
    empty.style.display=rows.length?'none':'block';
    list.querySelectorAll('.note-row').forEach(row=>{
      const open=()=>showDetail(notes[Number(row.dataset.index)]);
      row.addEventListener('click',open);
      row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
    });
  }
  function showDetail(n){
    document.getElementById('detailCategory').textContent=n.category;
    document.getElementById('detailTitle').textContent=n.title;
    document.getElementById('detailSummary').textContent=n.summary;
    document.getElementById('detailDate').textContent=n.date;
    document.getElementById('sourceLink').href=n.url;
    detail.classList.add('show');
    detail.scrollIntoView({behavior:'smooth',block:'nearest'});
  }
  document.getElementById('closeDetail').addEventListener('click',()=>detail.classList.remove('show'));
  category.addEventListener('change',render);
  keyword.addEventListener('input',render);
  render();
  </script>
</body>
</html>
