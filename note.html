<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0b5578">
  <title>교행노트 | 오춘기 권오영 업무지원 서비스</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f7f9;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .note-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    .home-link{position:fixed;left:18px;top:18px;z-index:99999;display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid rgba(255,255,255,.85);border-radius:999px;background:linear-gradient(135deg,#ffffff,#e8fffb);color:#0b3c5d;text-decoration:none;font-size:12px;font-weight:900;box-shadow:0 9px 26px rgba(5,40,61,.22);transition:.16s}
    .home-link:hover{transform:translateY(-2px);background:#dffaf5;color:#075e58}
    .home-icon{font-size:16px;line-height:1}
    .fallback{position:fixed;left:50%;bottom:22px;z-index:99998;transform:translateX(-50%);display:none;max-width:calc(100% - 32px);padding:10px 14px;border-radius:12px;background:#173042;color:#fff;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
    .fallback a{color:#bff5ea;font-weight:800}
    @media(max-width:700px){.home-link{left:12px;top:12px;padding:9px 12px;font-size:11px}}
  </style>
</head>
<body>
  <a class="home-link" href="index.html" aria-label="홈으로 이동"><span class="home-icon">⌂</span><span>홈</span></a>
  <iframe class="note-frame" id="noteFrame" src="https://gyohaeng.pages.dev/note/" title="교행노트" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <div class="fallback" id="fallback">원본 페이지가 브라우저 보안 정책으로 표시되지 않으면 <a href="https://gyohaeng.pages.dev/note/" target="_blank" rel="noopener noreferrer">원본 교행노트 열기</a>를 이용해 주세요.</div>
  <script>
    const frame=document.getElementById('noteFrame');
    const fallback=document.getElementById('fallback');
    const timer=setTimeout(()=>{fallback.style.display='block'},6000);
    frame.addEventListener('load',()=>{clearTimeout(timer);setTimeout(()=>{fallback.style.display='none'},800)});
  </script>
</body>
</html>
