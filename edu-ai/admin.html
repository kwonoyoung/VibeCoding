<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>전북교육행정 AI | 자료관리</title><style>
:root{--navy:#083a55;--blue:#0d6384;--bg:#f3f7f9;--card:#fff;--ink:#183444;--muted:#6c7f8b;--line:#dbe6eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);letter-spacing:-.02em}.head{background:linear-gradient(125deg,#062f48,#0c6b87);color:#fff}.head-in,.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.head-in{padding:25px 0}.head a{color:#fff;text-decoration:none;font-size:12px;border:1px solid rgba(255,255,255,.35);padding:8px 11px;border-radius:999px}.head h1{margin:24px 0 5px;font-size:28px}.head p{margin:0;color:#d5ebf1;font-size:13px}.wrap{padding:22px 0 50px}.notice{padding:13px 15px;border-radius:13px;background:#fff6df;border:1px solid #ebdcaf;font-size:12px;line-height:1.7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(17,56,78,.06)}.card h2{font-size:17px;margin:0 0 13px}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #cedce3;border-radius:10px;padding:10px;font:inherit;font-size:12px}.field textarea{height:92px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button,.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;font-size:12px;cursor:pointer;text-decoration:none}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf1f4;color:#315566}.danger{background:#faecec;color:#a13232}.docs{margin-top:12px;display:grid;gap:8px}.item{padding:11px;border:1px solid var(--line);border-radius:12px;background:#f9fbfc}.item b{font-size:12px}.item p{font-size:11px;color:var(--muted);line-height:1.55;margin:5px 0}.item button{padding:6px 9px;font-size:10px}.full{grid-column:1/-1}.status{font-size:11px;color:#0a7168;font-weight:900;margin-top:8px}@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header class="head"><div class="head-in"><a href="index.html">← AI 포털</a><h1>자료관리</h1><p>개인 브라우저에 자료 메타데이터와 AI 백엔드 주소를 저장합니다.</p></div></header>
<main class="wrap"><div class="notice"><b>현재 단계의 관리자 기능</b><br>이 화면의 자료 추가·수정은 현재 사용 중인 브라우저의 localStorage에 저장됩니다. 여러 사용자가 함께 쓰는 중앙관리 방식은 다음 단계에서 Supabase 등 DB를 연결해야 합니다. OpenAI API 키는 절대 이 페이지에 입력하지 마세요.</div>
<div class="grid">
<section class="card"><h2>AI 백엔드 연결</h2><div class="field"><label>Cloudflare Worker HTTPS 주소</label><input id="endpoint" placeholder="https://...workers.dev"></div><div class="actions"><button class="primary" id="saveEndpoint">주소 저장</button><button class="secondary" id="clearEndpoint">연결 해제</button></div><div class="status" id="endpointStatus"></div></section>
<section class="card"><h2>자료 가져오기·내보내기</h2><div class="field"><label>JSON 파일 가져오기</label><input type="file" id="importFile" accept="application/json,.json"></div><div class="actions"><button class="secondary" id="exportBtn">사용자 등록자료 JSON 내보내기</button><button class="danger" id="clearDocs">사용자 등록자료 전체 삭제</button></div><div class="status" id="fileStatus"></div></section>
<section class="card full"><h2>근거자료 추가</h2><div class="grid" style="margin-top:0"><div><div class="field"><label>자료명</label><input id="title" placeholder="예: 2026년 공무원 보수업무 등 처리지침"></div><div class="field"><label>분류</label><input id="category" placeholder="예: 급여·보수"></div><div class="field"><label>공식 출처 URL</label><input id="url" placeholder="https://..."></div></div><div><div class="field"><label>키워드 (쉼표 구분)</label><input id="keywords" placeholder="호봉, 보수, 급여"></div><div class="field"><label>검색용 요약</label><textarea id="summary" placeholder="이 자료가 어떤 질문에 활용되는지 간단히 입력하세요."></textarea></div></div></div><div class="actions"><button class="primary" id="addDoc">자료 추가</button></div></section>
<section class="card full"><h2>이 브라우저에 등록된 사용자 자료 <span id="count"></span></h2><div class="docs" id="docs"></div></section>
</div></main>
<script>
const $=s=>document.querySelector(s);let custom=[];function load(){custom=JSON.parse(localStorage.getItem('eduAiCustomDocs')||'[]');$('#endpoint').value=localStorage.getItem('eduAiWorkerEndpoint')||'';render();endpointState();}function save(){localStorage.setItem('eduAiCustomDocs',JSON.stringify(custom));render();}function esc(s=''){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function render(){$('#count').textContent=`(${custom.length}건)`;$('#docs').innerHTML=custom.length?custom.map((d,i)=>`<div class="item"><b>${esc(d.title)}</b><p>${esc(d.category)} · ${esc(d.summary||'')}</p><button class="danger" onclick="removeDoc(${i})">삭제</button></div>`).join(''):'<div class="item"><p>사용자가 추가한 자료가 없습니다.</p></div>';}window.removeDoc=i=>{custom.splice(i,1);save();};function endpointState(){const v=localStorage.getItem('eduAiWorkerEndpoint')||'';$('#endpointStatus').textContent=v?'AI 백엔드 주소가 등록되어 있습니다.':'현재 문서검색 모드입니다.';}
$('#saveEndpoint').onclick=()=>{const v=$('#endpoint').value.trim();if(v&&!/^https:\/\//i.test(v)){alert('HTTPS 주소를 입력하세요.');return;}localStorage.setItem('eduAiWorkerEndpoint',v);endpointState();};$('#clearEndpoint').onclick=()=>{localStorage.removeItem('eduAiWorkerEndpoint');$('#endpoint').value='';endpointState();};
$('#addDoc').onclick=()=>{const title=$('#title').value.trim();if(!title)return alert('자료명을 입력하세요.');custom.unshift({id:'custom-'+Date.now(),title,category:$('#category').value.trim()||'기타',summary:$('#summary').value.trim(),keywords:$('#keywords').value.split(',').map(x=>x.trim()).filter(Boolean),url:$('#url').value.trim()||'#'});save();['#title','#category','#summary','#keywords','#url'].forEach(x=>$(x).value='');};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(custom,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edu-ai-custom-documents.json';a.click();URL.revokeObjectURL(a.href);};
$('#clearDocs').onclick=()=>{if(confirm('사용자 등록자료를 모두 삭제할까요?')){custom=[];save();}};$('#importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw new Error();custom=[...data,...custom];save();$('#fileStatus').textContent=`${data.length}건을 가져왔습니다.`;}catch{$('#fileStatus').textContent='JSON 형식이 올바르지 않습니다.';}};load();
</script></body></html>
