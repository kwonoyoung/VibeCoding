<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공무원보수 질의응답집</title><script src="xlsx.full.min.js"></script>
<style>
:root{--navy:#0b3c5d;--teal:#0c8f82;--bg:#f3f7f9;--line:#dce7ec;--muted:#687c89}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#173042;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.hero{padding:28px 18px;background:linear-gradient(130deg,#082f4d,#0d617d 60%,#0b8b82);color:#fff}.hero-in,.wrap{width:min(1080px,100%);margin:auto}.brand{display:inline-flex;gap:8px;align-items:center;color:#fff;text-decoration:none;font-weight:850;font-size:13px}.hero h1{margin:30px 0 8px;font-size:clamp(25px,4vw,38px)}.hero p{margin:0;color:#d7edf2;line-height:1.7}.wrap{padding:22px 16px 55px}.panel{padding:22px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px rgba(17,61,83,.07)}.form{display:grid;grid-template-columns:2fr repeat(2,1fr);gap:12px}.field label{display:block;margin:0 0 7px;font-size:12px;font-weight:850}.field input,.field select{width:100%;height:46px;padding:0 13px;border:1px solid #cfdde4;border-radius:11px;background:#fff;font:inherit}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{height:44px;padding:0 17px;border:0;border-radius:11px;font-weight:850;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:#eaf1f5;color:#294b5e}.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:#eef8f6;color:#315e5b;font-size:12px;line-height:1.65}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 12px}.badge{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800}.result{margin-top:12px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:17px}.result h2{margin:0 0 8px;font-size:18px}.result h2 a{color:#173042;text-decoration:none}.result h2 a:hover,.result h2 a:focus{color:var(--teal);text-decoration:underline}.source-link{display:inline-block;margin-top:12px;color:#0a746a;font-size:13px;font-weight:800;text-decoration:none}.source-link:hover,.source-link:focus{text-decoration:underline}.meta{color:var(--muted);font-size:12px}.qa{margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}.qa h3{margin:0 0 7px;font-size:14px;color:#0a746a}.qa div{white-space:pre-wrap;line-height:1.75;font-size:14px}.empty{text-align:center;padding:50px 15px;color:var(--muted)}.loading{display:none;margin-top:15px;color:#0a746a;font-weight:800}.loading.show{display:block}.status{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#eef8f6;color:#315e5b;font-size:13px;font-weight:750}.status.show{display:block}.status.error{background:#fff0f0;color:#a12c2c}@media(max-width:720px){.form{grid-template-columns:1fr}.panel{padding:16px}.hero{padding-top:20px}}
</style></head><body>
<header class="hero"><div class="hero-in"><a class="brand" href="index.html">⌂ 오춘기 권오영 홈</a><h1>공무원보수 질의응답집</h1><p>국민신문고 공개 민원 질의응답 목록을 검색하고 중복 사례를 정리합니다.</p></div></header>
<main class="wrap"><section class="panel"><div class="form"><div class="field"><label for="keyword">검색어</label><input id="keyword" value="" maxlength="100" placeholder="예: 가족수당, 초과근무수당" autocomplete="off"></div><div class="field"><label for="from">등록일 시작</label><input id="from" type="date"></div><div class="field"><label for="to">등록일 종료 <span style="font-weight:500;color:#687c89">(미입력 시 오늘)</span></label><input id="to" type="date"></div></div><div class="actions"><button type="button" class="primary" id="search">질의응답 검색·정리</button><button type="button" class="secondary" id="xlsx" disabled>결과 XLSX 다운로드</button><button type="button" class="secondary" id="clear">결과 지우기</button></div><div class="notice">공개된 민원정책 질의응답 목록을 조회합니다. 같은 FAQ 번호의 중복 항목은 한 건으로 정리하며, 제목을 누르면 국민신문고의 해당 민원질의응답·답변원문 게시페이지로 이동합니다.</div><div class="loading" id="loading">국민신문고 자료를 조회하고 있습니다…</div><div class="status" id="status" role="status" aria-live="polite">검색 기능을 준비하고 있습니다.</div></section><div class="stats" id="stats"></div><section id="results"><div class="empty">검색어를 입력하고 검색 버튼을 눌러주세요.</div></section></main>
<script src="qna-app.js?v=20260814-2" defer></script></body></html>
