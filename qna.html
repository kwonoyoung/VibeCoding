<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공무원보수 질의응답집</title><script src="xlsx.full.min.js"></script>
<style>
:root{--navy:#0b3c5d;--teal:#0c8f82;--bg:#f3f7f9;--line:#dce7ec;--muted:#687c89}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#173042;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.hero{padding:28px 18px;background:linear-gradient(130deg,#082f4d,#0d617d 60%,#0b8b82);color:#fff}.hero-in,.wrap{width:min(1080px,100%);margin:auto}.brand{display:inline-flex;gap:8px;align-items:center;color:#fff;text-decoration:none;font-weight:850;font-size:13px}.hero h1{margin:30px 0 8px;font-size:clamp(25px,4vw,38px)}.hero p{margin:0;color:#d7edf2;line-height:1.7}.wrap{padding:22px 16px 55px}.panel{padding:22px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 32px rgba(17,61,83,.07)}.form{display:grid;grid-template-columns:2fr repeat(2,1fr);gap:12px}.field label{display:block;margin:0 0 7px;font-size:12px;font-weight:850}.field input,.field select{width:100%;height:46px;padding:0 13px;border:1px solid #cfdde4;border-radius:11px;background:#fff;font:inherit}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}button{height:44px;padding:0 17px;border:0;border-radius:11px;font-weight:850;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:#eaf1f5;color:#294b5e}.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:#eef8f6;color:#315e5b;font-size:12px;line-height:1.65}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 12px}.badge{padding:7px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:800}.result{margin-top:12px;padding:20px;background:#fff;border:1px solid var(--line);border-radius:17px}.result h2{margin:0 0 8px;font-size:18px}.result h2 a{color:#173042;text-decoration:none}.result h2 a:hover,.result h2 a:focus{color:var(--teal);text-decoration:underline}.source-link{display:inline-block;margin-top:12px;color:#0a746a;font-size:13px;font-weight:800;text-decoration:none}.source-link:hover,.source-link:focus{text-decoration:underline}.meta{color:var(--muted);font-size:12px}.qa{margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}.qa h3{margin:0 0 7px;font-size:14px;color:#0a746a}.qa div{white-space:pre-wrap;line-height:1.75;font-size:14px}.empty{text-align:center;padding:50px 15px;color:var(--muted)}.loading{display:none;margin-top:15px;color:#0a746a;font-weight:800}.loading.show{display:block}@media(max-width:720px){.form{grid-template-columns:1fr}.panel{padding:16px}.hero{padding-top:20px}}
</style></head><body>
<header class="hero"><div class="hero-in"><a class="brand" href="index.html">⌂ 오춘기 권오영 홈</a><h1>공무원보수 질의응답집</h1><p>국민신문고 공개 민원 질의응답 목록을 검색하고 중복 사례를 정리합니다.</p></div></header>
<main class="wrap"><section class="panel"><div class="form"><div class="field"><label for="keyword">검색어</label><input id="keyword" value="가족수당" maxlength="100" placeholder="예: 가족수당, 초과근무수당"></div><div class="field"><label for="from">등록일 시작</label><input id="from" type="date"></div><div class="field"><label for="to">등록일 종료 <span style="font-weight:500;color:#687c89">(미입력 시 오늘)</span></label><input id="to" type="date"></div></div><div class="actions"><button class="primary" id="search">질의응답 검색·정리</button><button class="secondary" id="xlsx" disabled>결과 XLSX 다운로드</button><button class="secondary" id="clear">결과 지우기</button></div><div class="notice">공개된 민원정책 질의응답 목록을 조회합니다. 같은 FAQ 번호의 중복 항목은 한 건으로 정리하며, 제목을 누르면 국민신문고의 해당 민원질의응답·답변원문 게시페이지로 이동합니다.</div><div class="loading" id="loading">국민신문고 자료를 조회하고 있습니다…</div></section><div class="stats" id="stats"></div><section id="results"><div class="empty">검색어를 입력하고 검색 버튼을 눌러주세요.</div></section></main>
<script>
const ENDPOINT='https://eqpiuszmgrwituwprgdc.supabase.co/functions/v1/epeople-qna';let rows=[];
const $=s=>document.querySelector(s), clean=s=>String(s??'').replace(/<br\s*\/?\s*>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').trim();
function date8(v){return v?String(v).split('-').join(''):''}
function todayLocal(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function fmt(v){const s=String(v||'');return /^\d{8}/.test(s)?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`:s}
function render(){const box=$('#results'),stats=$('#stats');stats.innerHTML=rows.length?`<span class="badge">정리 결과 ${rows.length}건</span><span class="badge">중복 제거 완료</span>`:'';$('#xlsx').disabled=!rows.length;if(!rows.length){box.innerHTML='<div class="empty">검색 결과가 없습니다.</div>';return}box.innerHTML=rows.map((r,i)=>{const url=sourceUrl(r.faqNo);return `<article class="result"><h2><a href="${esc(url)}" target="_blank" rel="noopener noreferrer" title="국민신문고 답변원문 새 창에서 보기">${i+1}. ${esc(r.title||'제목 없음')}</a></h2><div class="meta">FAQ ${esc(r.faqNo||'-')} · ${esc(r.ancName||'처리기관 미표시')} · ${esc(fmt(r.regDate)||'등록일 미표시')}</div><a class="source-link" href="${esc(url)}" target="_blank" rel="noopener noreferrer">국민신문고 답변원문 보기 ↗</a></article>`}).join('')}
function sourceUrl(faqNo){return faqNo?`https://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseDetail.npaid?dutySctnNm=tqapttn&epUnionSn=${encodeURIComponent(faqNo)}`:'https://www.epeople.go.kr/nep/pttn/gnrlPttn/pttnSmlrCaseList.npaid'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
$('#search').onclick=async()=>{const keyword=$('#keyword').value.trim();if(!keyword)return alert('검색어를 입력해 주세요.');const fromValue=$('#from').value;let toValue=$('#to').value;if(fromValue&&!toValue){toValue=todayLocal();$('#to').value=toValue}if(fromValue&&toValue&&fromValue>toValue)return alert('등록일 시작은 종료일보다 늦을 수 없습니다.');$('#loading').classList.add('show');$('#search').disabled=true;try{const res=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({keyword,regFrom:date8(fromValue),regTo:date8(toValue),limit:100})});const data=await res.json();if(!res.ok)throw Error(data.error||'조회에 실패했습니다.');rows=data.items||[];render();if(data.warning)alert(data.warning)}catch(e){rows=[];render();alert(e.message)}finally{$('#loading').classList.remove('show');$('#search').disabled=false}};
$('#clear').onclick=()=>{rows=[];render()};$('#keyword').addEventListener('keydown',e=>{if(e.key==='Enter')$('#search').click()});
$('#xlsx').onclick=()=>{const data=rows.map((r,i)=>({'번호':i+1,'FAQ번호':r.faqNo,'제목':r.title,'처리기관':r.ancName,'등록일':fmt(r.regDate),'국민신문고 원문 링크':sourceUrl(r.faqNo)}));const ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:7},{wch:14},{wch:36},{wch:20},{wch:13},{wch:80}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'질의응답');XLSX.writeFile(wb,`공무원보수_질의응답_${$('#keyword').value.trim()}.xlsx`)};
</script></body></html>
