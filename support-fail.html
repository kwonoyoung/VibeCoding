<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>후원 결제 실패</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f6f7f9;color:#173042;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}.box{width:min(520px,100%);padding:28px;border:1px solid #ead9dc;border-radius:22px;background:#fff;box-shadow:0 18px 44px rgba(20,54,75,.1);text-align:center}.ico{font-size:44px}.box h1{margin:12px 0 8px;font-size:24px}.box p{margin:0;color:#7a6670;font-size:13px;line-height:1.7}.detail{margin-top:16px;padding:13px;border-radius:12px;background:#fff3f4;color:#9d3c48;font-size:12px;line-height:1.6;word-break:break-word}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:18px}.actions a{padding:11px 16px;border-radius:11px;text-decoration:none;font-weight:900;font-size:13px}.primary{background:#0e5d7f;color:#fff}.secondary{background:#edf3f6;color:#345366}</style></head><body><main class="box"><div class="ico">⚠️</div><h1>결제가 완료되지 않았습니다</h1><p>결제를 취소했거나 결제 과정에서 오류가 발생했습니다.<br>금액이 청구되었는지 확인한 뒤 다시 시도해주세요.</p><div class="detail" id="detail"></div><div class="actions"><a class="primary" href="support.html">다시 시도</a><a class="secondary" href="index.html">메인으로</a></div></main><script>const q=new URLSearchParams(location.search),code=q.get('code')||'PAYMENT_NOT_COMPLETED',message=q.get('message')||'결제가 완료되지 않았습니다.';document.getElementById('detail').textContent=`${code} · ${message}`;</script></body></html>
