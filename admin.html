<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>회원 관리</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:#f3f7f9;color:#183448}.wrap{width:min(1100px,calc(100% - 28px));margin:28px auto}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:24px 26px;border-radius:20px;background:linear-gradient(135deg,#082f4d,#0e5d7f 62%,#0c9488);color:#fff;box-shadow:0 16px 38px rgba(7,54,82,.16)}h1{margin:0;font-size:25px}.head p{margin:6px 0 0;color:#d8eef1;font-size:13px}.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}.home{background:#fff;color:#0b4b69;text-decoration:none}.excel{background:#e4f7ed;color:#087749}.excel:hover{background:#d5f2e2}.card{margin-top:20px;background:#fff;border:1px solid #d8e4ea;border-radius:18px;box-shadow:0 8px 24px rgba(7,54,82,.07);overflow:hidden}.card-head{padding:16px 18px;border-bottom:1px solid #e5edf1;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card-head h2{margin:0;font-size:17px}.member-search{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.member-search input{width:min(300px,70vw);padding:9px 11px;border:1px solid #cadbe4;border-radius:9px;background:#fff;font:inherit;font-size:13px}.search-info{font-size:12px;color:#6a7f8b;font-weight:800}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:13px 14px;border-bottom:1px solid #e5edf1;text-align:left;font-size:13px}th{background:#f5f9fa;color:#4e6878}.status{font-weight:900}.approved{color:#087b64}.pending{color:#b17613}.blocked{color:#c2444d}.actions{display:flex;gap:6px;flex-wrap:wrap}.approve{background:#e5f6f2;color:#087b64}.block{background:#fdeced;color:#b63f49}.pendingBtn{background:#fff4dc;color:#9a6811}.msg{padding:18px;color:#667d8b;text-align:center}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.head-actions{justify-content:flex-start}.card-head{align-items:flex-start;flex-direction:column}.member-search{width:100%}.member-search input{width:100%}}</style></head><body><main class="wrap"><section class="head"><div><h1>회원 승인 관리</h1><p>관리자: kwonoyoung77@gmail.com</p></div><div class="head-actions"><button class="btn excel" id="downloadMembers" type="button">📥 회원명단 엑셀 다운로드</button><a class="btn home" href="index.html">홈으로</a></div></section><section class="card"><div class="card-head"><h2>회원명단</h2><div class="member-search"><input id="memberListSearch" type="search" placeholder="성명 · 기관명 · 이메일 검색" autocomplete="off"><span class="search-info" id="memberListCount">0명</span></div></div><div class="table"><table><thead><tr><th>성명</th><th>기관명</th><th>이메일</th><th>권한</th><th>상태</th><th>가입일</th><th>관리</th></tr></thead><tbody id="rows"><tr><td colspan="7" class="msg">회원 정보를 불러오는 중입니다.</td></tr></tbody></table></div></section></main><script>
const sb=supabase.createClient('https://eqpiuszmgrwituwprgdc.supabase.co','sb_publishable_SN2iYw3cBqstKGIS3NdoTw_5ghetwqQ');const rows=document.getElementById('rows'),memberListSearch=document.getElementById('memberListSearch'),memberListCount=document.getElementById('memberListCount');let allMembers=[];
async function init(){const {data:{session}}=await sb.auth.getSession();if(!session){location.href='login.html';return}const {data:me}=await sb.from('vibecoding_members').select('role,status').eq('user_id',session.user.id).single();if(!me||me.role!=='admin'||me.status!=='approved'){alert('관리자만 이용할 수 있습니다.');location.href='index.html';return}load()}
async function load(){const {data,error}=await sb.from('vibecoding_members').select('*').order('created_at',{ascending:false});if(error){rows.innerHTML='<tr><td colspan="7" class="msg">'+esc(error.message)+'</td></tr>';return}allMembers=data||[];renderMembers();window.dispatchEvent(new CustomEvent('vibecoding-members-loaded',{detail:{members:allMembers}}))}
function renderMembers(){const q=(memberListSearch.value||'').trim().toLowerCase();const data=!q?allMembers:allMembers.filter(m=>[m.display_name,m.institution,m.email].some(v=>String(v||'').toLowerCase().includes(q)));memberListCount.textContent=data.length.toLocaleString()+'명';rows.innerHTML=data.map(m=>`<tr><td>${esc(m.display_name||'-')}</td><td>${esc(m.institution||'-')}</td><td>${esc(m.email)}</td><td>${m.role==='admin'?'관리자':'회원'}</td><td><span class="status ${m.status}">${label(m.status)}</span></td><td>${fmt(m.created_at)}</td><td>${m.role==='admin'?'관리자 계정':`<div class="actions"><button class="btn approve" onclick="setStatus('${m.user_id}','approved')">승인</button><button class="btn pendingBtn" onclick="setStatus('${m.user_id}','pending')">대기</button><button class="btn block" onclick="setStatus('${m.user_id}','blocked')">차단</button></div>`}</td></tr>`).join('')||'<tr><td colspan="7" class="msg">검색 조건에 맞는 회원이 없습니다.</td></tr>'}
async function setStatus(id,status){const {data:{user}}=await sb.auth.getUser();const payload={status,approved_at:status==='approved'?new Date().toISOString():null,approved_by:status==='approved'?user.id:null};const {error}=await sb.from('vibecoding_members').update(payload).eq('user_id',id);if(error)alert(error.message);else load()}
function downloadMembersXlsx(){if(!allMembers.length)return alert('다운로드할 회원 정보가 없습니다.');if(!window.XLSX)return alert('엑셀 다운로드 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');const data=allMembers.map((m,i)=>({'번호':i+1,'성명':m.display_name||'','기관명':m.institution||'','이메일':m.email||'','권한':m.role==='admin'?'관리자':'회원','상태':label(m.status),'가입일':fmt(m.created_at),'승인일':fmt(m.approved_at)}));const ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:7},{wch:14},{wch:24},{wch:32},{wch:10},{wch:12},{wch:22},{wch:22}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'회원명단');const d=new Date(),pad=n=>String(n).padStart(2,'0');XLSX.writeFile(wb,`오춘기_회원명단_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.xlsx`)}
function label(s){return s==='approved'?'승인':s==='pending'?'승인 대기':s==='blocked'?'차단':s||'-'}function fmt(d){return d?new Date(d).toLocaleString('ko-KR'):'-'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
memberListSearch.addEventListener('input',renderMembers);document.getElementById('downloadMembers').addEventListener('click',downloadMembersXlsx);init();
</script><script src="member-permissions-admin.js?v=20260815-2"></script>
</body></html>
