<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#0b5578">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>학교회계 예산 업무 도구 | 오춘기 권오영 업무지원 서비스</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7f9;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .tool-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    .home-link{position:fixed;left:18px;top:18px;z-index:99999;display:inline-flex;align-items:center;gap:7px;padding:10px 15px;border:1px solid rgba(255,255,255,.92);border-radius:999px;background:linear-gradient(135deg,#ffffff,#e8fffb);color:#0b3c5d!important;text-decoration:none;font-size:12px;font-weight:900;box-shadow:0 9px 26px rgba(5,40,61,.24);transition:.16s;pointer-events:auto}
    .home-link:hover{transform:translateY(-2px);background:#dffaf5;color:#075e58!important}
    .home-icon{font-size:16px;line-height:1}
    .loading{position:fixed;left:50%;top:50%;z-index:2;transform:translate(-50%,-50%);padding:14px 18px;border:1px solid #d7e4ea;border-radius:14px;background:#fff;color:#5c7280;font-size:13px;font-weight:800;box-shadow:0 12px 32px rgba(6,46,76,.12);pointer-events:none}
    @media(max-width:700px){.home-link{left:12px;top:12px;padding:9px 12px;font-size:11px}}
  </style>
</head>
<body>
  <a class="home-link" href="index.html" aria-label="홈으로 이동"><span class="home-icon" aria-hidden="true">⌂</span><span>홈</span></a>
  <div class="loading" id="loading">학교회계 예산 도구를 불러오는 중입니다.</div>
  <iframe class="tool-frame" id="toolFrame" src="https://gyohaeng.pages.dev/tools/hakgyo/school_budget" title="학교회계 예산 업무 도구" loading="eager" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    const frame=document.getElementById('toolFrame');
    const loading=document.getElementById('loading');
    frame.addEventListener('load',()=>{loading.style.display='none'});
    setTimeout(()=>{loading.style.display='none'},8000);
  </script>
</body>
</html>
