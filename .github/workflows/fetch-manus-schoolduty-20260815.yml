name: Fetch Manus schoolduty source 20260815

on:
  push:
    paths:
      - '.github/workflows/fetch-manus-schoolduty-20260815.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Manus page for analysis
        shell: bash
        run: |
          mkdir -p .github/tmp-manus
          curl --fail --location --retry 3 --max-time 60 \
            'https://schoolduty-eiwebfme.manus.space/' \
            -o .github/tmp-manus/schoolduty-root.html
          python - <<'PY'
          from pathlib import Path
          import re, html
          p=Path('.github/tmp-manus/schoolduty-root.html')
          s=p.read_text(encoding='utf-8', errors='replace')
          urls=[]
          for m in re.findall(r'(?:src|href)=["\']([^"\']+)["\']', s):
              if m.startswith('/') or m.startswith('http'):
                  urls.append(m)
          Path('.github/tmp-manus/assets.txt').write_text('\n'.join(dict.fromkeys(urls)),encoding='utf-8')
          print('Fetched bytes:', len(s.encode('utf-8')))
          print('Assets:', len(urls))
          PY
      - name: Commit analysis source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp-manus
          git commit -m "Fetch Manus schoolduty source for analysis"
          git push
