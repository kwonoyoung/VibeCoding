name: Daily AI directory auto-update

on:
  schedule:
    # 01:00 Korea Standard Time every day (16:00 UTC on the previous day)
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ai-directory-daily-update
  cancel-in-progress: false

jobs:
  update-review-date:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Bump REVIEWED_AT to today (KST)
        id: bump
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = 'ai.html'
          text = open(path, encoding='utf-8').read()
          today = datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d')

          new_text, count = re.subn(
              r'(const\s+REVIEWED_AT\s*=\s*["\'])\d{4}-\d{2}-\d{2}(["\'])',
              rf'\g<1>{today}\g<2>',
              text
          )
          if count == 0:
              print('::error::REVIEWED_AT constant not found in ai.html')
              raise SystemExit(1)

          changed = new_text != text
          if changed:
              open(path, 'w', encoding='utf-8').write(new_text)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'today={today}\n')
              f.write(f'changed={str(changed).lower()}\n')
          PY

      - name: Commit and push updated review date
        if: steps.bump.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai.html
          git commit -m "chore(ai): auto-update daily review date to ${{ steps.bump.outputs.today }}"
          git push

      - name: Close stale-update issue after recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'ai-directory-update-failed', per_page: 20
            });
            for (const issue of openIssues) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '자동 현행화 작업이 정상적으로 완료되어 자동으로 종료합니다.'
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'ai-directory-update-failed';
            const kstDate = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(new Date());
            const title = `[AI 디렉터리 자동 현행화 실패] ${kstDate}`;
            const body = [
              '## AI 디렉터리 자동 현행화 실패',
              '',
              `- 한국시간 기준일: **${kstDate}**`,
              `- 워크플로 실행: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              '매일 01:00 KST 자동 현행화 작업이 실패했습니다. 위 실행 로그를 확인해 주세요.'
            ].join('\n');

            const { data: labels } = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
            if (!labels.some(item => item.name === label)) {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'D73A4A',
                description: 'Daily AI directory update did not complete'
              });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20
            });
            if (openIssues.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: openIssues[0].number, title, body
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
