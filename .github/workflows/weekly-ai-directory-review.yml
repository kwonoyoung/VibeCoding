name: Daily AI directory freshness watchdog

on:
  schedule:
    # 01:30 Korea Standard Time every day (16:30 UTC on the previous day)
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ai-directory-watchdog
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6

      - name: Verify today's AI directory review date
        id: fresh
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from datetime import datetime
          from zoneinfo import ZoneInfo

          text = open('ai.html', encoding='utf-8').read()
          match = re.search(r'const\s+REVIEWED_AT\s*=\s*["\'](\d{4}-\d{2}-\d{2})["\']', text)
          reviewed = match.group(1) if match else ''
          today = datetime.now(ZoneInfo('Asia/Seoul')).strftime('%Y-%m-%d')
          current = str(reviewed == today).lower()
          print(f'REVIEWED_AT={reviewed or "missing"}; KST today={today}; current={current}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f'reviewed={reviewed}\n')
              f.write(f'today={today}\n')
              f.write(f'current={current}\n')
          PY

      - name: Create or refresh stale-update issue
        if: steps.fresh.outputs.current != 'true'
        uses: actions/github-script@v7
        env:
          REVIEWED_AT: ${{ steps.fresh.outputs.reviewed }}
          KST_TODAY: ${{ steps.fresh.outputs.today }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'ai-directory-update-failed';
            const title = `[AI 디렉터리 자동 현행화 실패] ${process.env.KST_TODAY}`;
            const body = [
              '## AI 디렉터리 자동 현행화 점검 실패',
              '',
              `- 한국시간 기준일: **${process.env.KST_TODAY}**`,
              `- ai.html REVIEWED_AT: **${process.env.REVIEWED_AT || '없음'}**`,
              '',
              '매일 01:00 KST 현행화 작업이 ai.html의 검토일을 오늘 날짜로 반영하지 못했습니다.',
              '자동 작업과 GitHub Pages 배포 상태를 확인해 주세요.'
            ].join('\n');

            const { data: labels } = await github.rest.issues.listLabelsForRepo({ owner, repo, per_page: 100 });
            if (!labels.some(item => item.name === label)) {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'D73A4A',
                description: 'Daily AI directory update or deployment did not complete'
              });
            }

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20
            });
            if (openIssues.length) {
              await github.rest.issues.update({
                owner, repo, issue_number: openIssues[0].number, title, body
              });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }

      - name: Close stale-update issue after recovery
        if: steps.fresh.outputs.current == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'ai-directory-update-failed', per_page: 20
            });
            for (const issue of openIssues) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number,
                body: '오늘자 REVIEWED_AT 반영을 확인하여 자동으로 종료합니다.'
              });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }

      - name: Setup Pages
        if: steps.fresh.outputs.current == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload current site
        if: steps.fresh.outputs.current == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy verified current site to GitHub Pages
        if: steps.fresh.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
