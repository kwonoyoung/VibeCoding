name: Remove schoolduty menus 8 and 9

on:
  push:
    paths:
      - '.github/workflows/remove-schoolduty-menus.yml'

permissions:
  contents: write

jobs:
  update-schoolduty:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove menu items 8 and 9
        shell: python
        run: |
          from pathlib import Path

          path = Path('schoolduty.html')
          text = path.read_text(encoding='utf-8')

          targets = [
              '<button data-page="historyPage">8. 인수인계·이력</button>',
              '<button data-page="reference">9. 지침·매뉴얼</button>',
          ]

          missing = [target for target in targets if target not in text]
          if missing:
              raise SystemExit('Expected menu markup not found: ' + ' | '.join(missing))

          for target in targets:
              text = text.replace(target, '')

          path.write_text(text, encoding='utf-8')

      - name: Commit menu removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schoolduty.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove schoolduty menu items 8 and 9"
          git push
