name: Apply schoolduty cleanup 20260815

on:
  push:
    paths:
      - '.github/workflows/apply-schoolduty-cleanup-20260815.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested schoolduty changes
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('schoolduty.html')
          text = path.read_text(encoding='utf-8')

          # 1) subtitle text
          text = text.replace(
              '전북특별자치도교육청 학교 행정실 근무 지방공무원 업무분장 표준안 지원',
              '전북특별자치도교육청 학교 지방공무원 업무분장 표준안 지원'
          )

          # 2) dashboard: remove standard info + workflow strip panel
          text, n1 = re.subn(
              r'<div class="panel"><div class="info-strip" id="standardInfo"></div><div class="status-flow" id="statusFlow"></div></div>',
              '', text, count=1
          )

          # 3) dashboard: remove deputy assignment summary panel
          text, n2 = re.subn(
              r'<div class="panel"><h2>정·부 담당자 지정 현황</h2><div class="mini-grid" id="deputySummary"></div></div>',
              '', text, count=1
          )

          # 4) duties: remove scoring guide panel
          text, n3 = re.subn(
              r'<div class="panel"><h2>업무시간·중요도·난이도 산정 가이드</h2><div class="score-grid">.*?</div></div></div>',
              '', text, count=1, flags=re.S
          )

          # 5) export: remove the existing reset action card
          reset_card = '<div class="action-card"><h3>원본으로 되돌리기</h3><p>자동 백업 후 표준 업무로 복원합니다.</p><button class="danger" id="resetBtn">초기화</button></div>'
          text = text.replace(reset_card, '')

          # 6) move reset button next to workflow save button
          save_btn = '<button class="soft" id="saveWorkflow" style="margin-top:12px">상태 저장</button>'
          replacement = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="soft" id="saveWorkflow">상태 저장</button><button class="danger" id="resetBtn">초기화(원본으로 돌리기)</button></div>'
          if save_btn not in text:
              raise SystemExit('Could not find workflow save button')
          text = text.replace(save_btn, replacement, 1)

          if n1 != 1:
              raise SystemExit(f'Dashboard standard/status panel removal count: {n1}')
          if n2 != 1:
              raise SystemExit(f'Dashboard deputy panel removal count: {n2}')
          if n3 != 1:
              raise SystemExit(f'Duty scoring guide removal count: {n3}')
          if text.count('id="resetBtn"') != 1:
              raise SystemExit('resetBtn should exist exactly once')

          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schoolduty.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply schoolduty cleanup and reset button changes"
          git push
