name: Fix schoolduty image removals 20260815

on:
  push:
    paths:
      - '.github/workflows/fix-schoolduty-image-removals-20260815.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply corrected removals
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('schoolduty.html')
          text = path.read_text(encoding='utf-8')

          # Ensure requested subtitle
          text = text.replace(
              '전북특별자치도교육청 학교 행정실 근무 지방공무원 업무분장 표준안 지원',
              '전북특별자치도교육청 학교 지방공무원 업무분장 표준안 지원'
          )

          # Dashboard removals (images 제거, 제거2)
          text = text.replace('<div class="panel"><div class="info-strip" id="standardInfo"></div><div class="status-flow" id="statusFlow"></div></div>', '')
          text = text.replace('<div class="panel"><h2>정·부 담당자 지정 현황</h2><div class="mini-grid" id="deputySummary"></div></div>', '')

          # Restore scoring guide if previous edit removed it
          scoring = '<div class="panel"><h2>업무시간·중요도·난이도 산정 가이드</h2><div class="score-grid"><div><b>업무시간 1~10</b><br>연간 처리 빈도와 소요시간을 종합합니다.</div><div><b>중요도 1~10</b><br>법정기한, 예산·급여 영향, 결재 책임과 오류 위험을 반영합니다.</div><div><b>난이도 상·중·하</b><br>전문성·판단 책임을 반영하며 상 1.3, 중 1.0, 하 0.8의 가중치를 적용합니다.</div></div></div>'
          duties_marker = '<section id="duties" class="page"><div class="hero"><div><div class="eyebrow">DUTY REGISTER</div><h1>업무를 배정하고 조정합니다.</h1><p>업무시간·중요도·난이도·집중 시기와 정·부 담당자를 기록하면 업무량과 균형 지수가 즉시 갱신됩니다.</p></div><button class="primary" id="addDuty">+ 학교 추가업무</button></div>'
          if scoring not in text:
              if duties_marker not in text:
                  raise SystemExit('Duties marker not found')
              text = text.replace(duties_marker, duties_marker + scoring, 1)

          # Remove monthly focus panel (image 제거3)
          monthly = '<div class="panel"><h2>월별 집중 업무</h2><div class="calendar" id="monthCalendar"></div></div>'
          text = text.replace(monthly, '')

          # Remove full export action card grid (image 제거4)
          start = text.find('<div class="export-grid no-print">')
          end_marker = '<div class="panel"><h2 id="printTitle"></h2>'
          if start != -1:
              end = text.find(end_marker, start)
              if end == -1:
                  raise SystemExit('Export grid end marker not found')
              text = text[:start] + text[end:]

          # Ensure reset button exists only beside status save
          wanted = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="soft" id="saveWorkflow">상태 저장</button><button class="danger" id="resetBtn">초기화(원본으로 돌리기)</button></div>'
          old_save = '<button class="soft" id="saveWorkflow" style="margin-top:12px">상태 저장</button>'
          if wanted not in text:
              if old_save in text:
                  text = text.replace(old_save, wanted, 1)
              else:
                  raise SystemExit('Workflow save/reset area not found')

          # Remove any stray duplicate reset card/button outside the status area
          text = text.replace('<div class="action-card"><h3>원본으로 되돌리기</h3><p>자동 백업 후 표준 업무로 복원합니다.</p><button class="danger" id="resetBtn">초기화</button></div>', '')
          if text.count('id="resetBtn"') != 1:
              raise SystemExit(f'resetBtn count is {text.count(chr(105)+chr(100)+"=\"resetBtn\"")}')

          # Verify requested removed areas are gone
          for forbidden in [
              'id="standardInfo"',
              'id="statusFlow"',
              '정·부 담당자 지정 현황',
              'id="monthCalendar"',
              '<div class="export-grid no-print">'
          ]:
              if forbidden in text:
                  raise SystemExit('Still present: ' + forbidden)

          path.write_text(text, encoding='utf-8')

      - name: Commit corrected page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schoolduty.html
          git diff --cached --quiet && exit 0
          git commit -m "Correct schoolduty removals from reference images"
          git push
