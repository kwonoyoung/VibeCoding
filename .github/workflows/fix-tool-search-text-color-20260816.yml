name: Fix tool search text color 20260816

on:
  push:
    paths:
      - '.github/workflows/fix-tool-search-text-color-20260816.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Improve tool search button contrast
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          css = '.quick button,.quick button span,.quick a.tool-search-btn,.quick a.tool-search-btn span,#toolSearchBtn,#toolSearchBtn span{color:#fff!important;text-shadow:0 1px 1px rgba(0,0,0,.12)}'
          if css not in text:
              text = text.replace('</style>', css + '\n</style>', 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify change
        shell: bash
        run: |
          grep -Fq '#toolSearchBtn span{color:#fff!important' index.html

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve tool search button text contrast"
          git push
