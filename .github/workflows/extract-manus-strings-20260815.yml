name: Extract Manus schoolduty strings 20260815

on:
  push:
    paths:
      - '.github/workflows/extract-manus-strings-20260815.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract readable Korean strings from bundle
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('.github/tmp-manus/app.js')
          s=p.read_text(encoding='utf-8', errors='replace')
          # Decode common escaped sequences enough for inspection.
          s=s.replace('\\n',' ').replace('\\t',' ')
          chunks=[]
          for m in re.finditer(r'[가-힣][가-힣A-Za-z0-9·ㆍ\s.,:;!?()\[\]{}~%+\-_/×→±=<>]{1,140}', s):
              t=' '.join(m.group(0).split()).strip(' ,;')
              if len(t)>=2 and t not in chunks:
                  chunks.append(t)
          # Prefer UI-like strings and keep source order.
          Path('.github/tmp-manus/korean-strings.txt').write_text('\n'.join(chunks),encoding='utf-8')
      - name: Commit extracted strings
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tmp-manus/korean-strings.txt
          git commit -m "Extract Manus schoolduty UI strings"
          git push
