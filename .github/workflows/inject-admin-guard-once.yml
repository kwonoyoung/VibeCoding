name: Inject Persistent Admin Login Guard

on:
  push:
    paths:
      - '.github/workflows/inject-admin-guard-once.yml'

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inject guard script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./admin-button-guard.js?v=20260812-2145" data-admin-guard="1"></script>'
          if 'data-admin-guard="1"' not in s:
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
              else:
                  s += '\n'+tag+'\n'
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Keep admin login button visible after auth UI refresh"
          git push