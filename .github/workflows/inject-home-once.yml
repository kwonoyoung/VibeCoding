name: Fix VibeCoding Home Navigation

on:
  push:
    paths:
      - '.github/workflows/inject-home-once.yml'

permissions:
  contents: write

jobs:
  fix-home-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach latest-home navigation helper to every tool page
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'Hazardpay.html',
              'ai.html',
              'choga.html',
              'end.html',
              'gum.html',
              'gumgun.html',
              'hazardpay2.html',
              'parental-leave-calculator.html',
              'person.html',
              'ret.html',
          ]
          tag = '<script src="./latest-home-nav.js?v=20260807-2341" data-vibecoding-latest-home="1"></script>'
          changed = []

          for name in files:
              path = Path(name)
              if not path.exists():
                  print(f'SKIP missing: {name}')
                  continue
              original = path.read_text(encoding='utf-8')
              text = re.sub(r'\s*<script\b[^>]*data-vibecoding-latest-home=["\']1["\'][^>]*></script>\s*', '\n', original, flags=re.I)
              if re.search(r'</body\s*>', text, flags=re.I):
                  text = re.sub(r'</body\s*>', tag + '\n</body>', text, count=1, flags=re.I)
              else:
                  text += '\n' + tag + '\n'

              if text != original:
                  path.write_text(text, encoding='utf-8', newline='')
                  changed.append(name)
                  print(f'UPDATED: {name}')

          print(f'Changed {len(changed)} file(s): {changed}')
          if len(changed) != len(files):
              print('Some pages may already contain the latest helper or be missing.')

      - name: Commit fixed home navigation
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hazardpay.html ai.html choga.html end.html gum.html gumgun.html hazardpay2.html parental-leave-calculator.html person.html ret.html
          git commit -m "Make all tool home buttons open the latest index"
          git push
