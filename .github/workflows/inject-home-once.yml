name: Fix VibeCoding Home Navigation

on:
  push:
    paths:
      - '.github/workflows/inject-home-once.yml'

permissions:
  contents: write

jobs:
  fix-home-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Point every tool home button to the latest index page
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'Hazardpay.html',
              'ai.html',
              'choga.html',
              'end.html',
              'gum.html',
              'gumgun.html',
              'hazardpay2.html',
              'parental-leave-calculator.html',
              'person.html',
              'ret.html',
          ]

          HOME = '/VibeCoding/index.html?home=latest-20260807-2341'
          marker_start = '<!-- VibeCoding latest home navigation start -->'
          marker_end = '<!-- VibeCoding latest home navigation end -->'
          nav_script = f'''{marker_start}
<script>
(() => {{
  const HOME = '{HOME}';

  if ('serviceWorker' in navigator) {{
    navigator.serviceWorker.getRegistrations()
      .then(regs => Promise.all(regs.map(reg => reg.unregister())))
      .catch(() => {{}});
  }}
  if ('caches' in window) {{
    caches.keys().then(keys => Promise.all(keys.map(key => caches.delete(key)))).catch(() => {{}});
  }}

  const fixLinks = () => {{
    document.querySelectorAll('a').forEach(a => {{
      const txt = (a.textContent || '').replace(/\\s+/g, ' ').trim();
      const href = a.getAttribute('href') || '';
      const explicit = a.id === 'vibecoding-home-btn' || a.getAttribute('data-vibecoding-home') === 'persistent';
      const looksLikeHome = /(?:⌂\\s*홈|VibeCoding.*🏠|홈으로)/i.test(txt) && /^(?:\\.\\/?|index\\.html|\/VibeCoding\/?|\/VibeCoding\/index\\.html)/i.test(href);
      if (explicit || looksLikeHome) a.setAttribute('href', HOME);
    }});
  }};

  fixLinks();
  document.addEventListener('DOMContentLoaded', fixLinks, {{once:true}});
  document.addEventListener('click', event => {{
    const a = event.target.closest && event.target.closest('a');
    if (!a) return;
    const txt = (a.textContent || '').replace(/\\s+/g, ' ').trim();
    const explicit = a.id === 'vibecoding-home-btn' || a.getAttribute('data-vibecoding-home') === 'persistent';
    const looksLikeHome = /(?:⌂\\s*홈|VibeCoding.*🏠|홈으로)/i.test(txt);
    if (explicit || looksLikeHome) {{
      event.preventDefault();
      window.location.href = HOME;
    }}
  }}, true);
}})();
</script>
{marker_end}'''

          changed = []
          for name in files:
              path = Path(name)
              if not path.exists():
                  print(f'SKIP missing: {name}')
                  continue
              original = path.read_text(encoding='utf-8')
              text = original

              text = re.sub(
                  re.escape(marker_start) + r'.*?' + re.escape(marker_end),
                  '', text, flags=re.S
              )

              text = re.sub(
                  r'(<a\b(?=[^>]*\bid=["\']vibecoding-home-btn["\'])[^>]*\bhref=)["\'][^"\']*["\']',
                  lambda m: m.group(1) + '"' + HOME + '"', text, flags=re.I
              )
              text = re.sub(
                  r'(<a\b(?=[^>]*\bdata-vibecoding-home=["\']persistent["\'])[^>]*\bhref=)["\'][^"\']*["\']',
                  lambda m: m.group(1) + '"' + HOME + '"', text, flags=re.I
              )
              text = re.sub(
                  r'(<a\b[^>]*class=["\'][^"\']*ghost[^"\']*["\'][^>]*\bhref=)["\']\./["\']([^>]*>\s*VibeCoding\s*🏠\s*</a>)',
                  lambda m: m.group(1) + '"' + HOME + '"' + m.group(2), text, flags=re.I
              )

              if re.search(r'</body\s*>', text, flags=re.I):
                  text = re.sub(r'</body\s*>', nav_script + '\n</body>', text, count=1, flags=re.I)
              else:
                  text += '\n' + nav_script

              if text != original:
                  path.write_text(text, encoding='utf-8', newline='')
                  changed.append(name)
                  print(f'UPDATED: {name}')

          sw = Path('home-nav-sw.js')
          sw_text = """self.addEventListener('install', () => self.skipWaiting());
self.addEventListener('activate', event => {
  event.waitUntil((async () => {
    await self.registration.unregister();
    const clients = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });
    for (const client of clients) client.navigate(client.url);
  })());
});
"""
          if not sw.exists() or sw.read_text(encoding='utf-8') != sw_text:
              sw.write_text(sw_text, encoding='utf-8', newline='')
              changed.append('home-nav-sw.js')
              print('UPDATED: home-nav-sw.js')

          print(f'Changed {len(changed)} file(s): {changed}')

      - name: Commit fixed home navigation
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hazardpay.html ai.html choga.html end.html gum.html gumgun.html hazardpay2.html parental-leave-calculator.html person.html ret.html home-nav-sw.js
          git commit -m "Make all home buttons open latest VibeCoding index"
          git push
