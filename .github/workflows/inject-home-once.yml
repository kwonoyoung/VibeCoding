name: Roll Back Pure Inspired Theme

on:
  push:
    paths:
      - '.github/workflows/inject-home-once.yml'

permissions:
  contents: write

jobs:
  rollback-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Pure-inspired shared theme from every HTML page
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [
              'index.html',
              'Hazardpay.html',
              'ai.html',
              'choga.html',
              'end.html',
              'gum.html',
              'gumgun.html',
              'hazardpay2.html',
              'parental-leave-calculator.html',
              'person.html',
              'ret.html',
          ]

          theme_re = re.compile(r'\s*<link\b[^>]*data-vibecoding-theme=["\']pure-dark["\'][^>]*>\s*', re.I)
          changed = []

          for name in files:
              path = Path(name)
              if not path.exists():
                  print(f'SKIP missing: {name}')
                  continue
              original = path.read_text(encoding='utf-8')
              text = theme_re.sub('\n', original)
              if text != original:
                  path.write_text(text, encoding='utf-8', newline='')
                  changed.append(name)
                  print(f'RESTORED: {name}')
              else:
                  print(f'OK no Pure theme link: {name}')

          print(f'Restored {len(changed)} file(s): {changed}')

      - name: Commit restored page designs
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Hazardpay.html ai.html choga.html end.html gum.html gumgun.html hazardpay2.html parental-leave-calculator.html person.html ret.html
          git commit -m "Restore VibeCoding design before Pure theme"
          git push
