name: Clean Up VibeCoding Home Page

on:
  push:
    paths:
      - '.github/workflows/inject-home-once.yml'

permissions:
  contents: write

jobs:
  clean-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply requested index page cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1) Rename the top-left service title.
          text = text.replace(
              '<div>업무지원 서비스<small>VIBE CODING TOOL HUB</small></div>',
              '<div>전북특별자치도교육청 업무지원 서비스<small>VIBE CODING TOOL HUB</small></div>'
          )

          # 2) Remove the "업무 도구 10개" badge.
          text = re.sub(
              r'\s*<div class="count"><i></i>\s*업무 도구\s*10개</div>',
              '', text, count=1
          )

          # 3) Remove every visible *.html filename label from menu cards.
          text = re.sub(
              r'<div class="file">.*?\.html</div>',
              '', text, flags=re.I
          )

          # 4) Remove the old VibeCoding footer/status block requested by the user.
          text = re.sub(
              r'\s*<footer class="footer">.*?</footer>\s*',
              '\n', text, count=1, flags=re.S
          )

          # The removed footer contained navStatus; remove its now-unused status script too.
          text = re.sub(
              r'\s*<script>\s*\(\(\) => \{\s*const status = document\.getElementById\(\'navStatus\'\);.*?\}\)\(\);\s*</script>\s*',
              '\n', text, count=1, flags=re.S
          )

          if text == original:
              print('No changes required.')
          else:
              path.write_text(text, encoding='utf-8', newline='')
              print('UPDATED index.html')

          checks = {
              'new service title': '전북특별자치도교육청 업무지원 서비스<small>VIBE CODING TOOL HUB</small>' in text,
              'tool count removed': '업무 도구 10개' not in text,
              'menu filename labels removed': '<div class="file">' not in text,
              'old footer removed': 'VibeCoding 업무지원 서비스' not in text and '각 도구는 동일한 GitHub Pages 사이트 안에서 실행됩니다.' not in text,
              'home status text removed': '각 도구의 홈 버튼 사용 가능' not in text,
          }
          for label, ok in checks.items():
              print(f'{label}: {"OK" if ok else "FAIL"}')
          if not all(checks.values()):
              raise SystemExit('One or more requested changes were not applied correctly.')

      - name: Commit cleaned home page
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Clean up VibeCoding home page labels"
          git push
