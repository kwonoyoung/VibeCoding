name: Update AI review date once

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run AI directory review date update for 2026-08-30'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update review date and remove one-off workflow
        shell: bash
        run: |
          sed -i 's/const REVIEWED_AT = "2026-08-29";/const REVIEWED_AT = "2026-08-30";/' ai.html
          rm .github/workflows/update-ai-review-date-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai.html .github/workflows/update-ai-review-date-once.yml
          git commit -m "Update AI directory review date for 2026-08-30"
          git push
      - name: Dispatch Pages deployment on updated main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main
