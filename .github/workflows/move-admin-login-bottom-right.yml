name: Move Admin Login Bottom Right
on:
  push:
    paths:
      - '.github/workflows/move-admin-login-bottom-right.yml'
permissions:
  contents: write
jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin login position
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=".admin-left-login{position:absolute;left:18px;top:16px;z-index:99999;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid rgba(255,255,255,.45);border-radius:999px;background:rgba(255,255,255,.96);color:#0b3c5d!important;text-decoration:none;font-size:12px;font-weight:900;box-shadow:0 8px 22px rgba(0,0,0,.18);pointer-events:auto!important}.admin-left-login:hover{background:#e8fffb;color:#075e58!important;transform:translateY(-1px)}@media(max-width:700px){.admin-left-login{left:12px;top:10px;padding:8px 11px;font-size:11px}.hero-inner{padding-top:64px!important}}"
          new=".admin-left-login{position:fixed;right:22px;bottom:22px;left:auto;top:auto;z-index:99999;display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border:1px solid rgba(255,255,255,.82);border-radius:999px;background:linear-gradient(135deg,#ffffff,#e8fffb);color:#0b3c5d!important;text-decoration:none;font-size:12px;font-weight:900;box-shadow:0 10px 28px rgba(0,0,0,.22);pointer-events:auto!important}.admin-left-login:hover{background:#dffaf5;color:#075e58!important;transform:translateY(-2px)}@media(max-width:700px){.admin-left-login{right:12px;bottom:12px;left:auto;top:auto;padding:9px 12px;font-size:11px}}"
          if old not in s:
              raise SystemExit('target admin CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "kwonoyoung"
          git config user.email "kwonoyoung77@gmail.com"
          git add index.html
          git commit -m "Move admin login button to bottom right"
          git push