name: Refresh AI reviewed date once

on:
  push:
    paths:
      - .github/workflows/refresh-ai-reviewed-at-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update reviewed date
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai.html')
          s = p.read_text(encoding='utf-8')
          old = 'const REVIEWED_AT = "2026-08-23";'
          new = 'const REVIEWED_AT = "2026-08-24";'
          if old not in s:
              raise SystemExit('Expected REVIEWED_AT value not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit ai.html only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai.html
          git diff --cached --quiet && exit 0
          git commit -m "Review AI directory for 2026-08-24"
          git push

# trigger: 2026-08-24
