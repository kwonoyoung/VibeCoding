name: Patch AI directory 2026-08-25

on:
  push:
    paths:
      - '.github/workflows/patch-ai-directory-20260825.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update verified AI directory fields
        shell: python
        run: |
          from pathlib import Path
          path = Path('ai.html')
          text = path.read_text(encoding='utf-8')
          old_date = 'const REVIEWED_AT = "2026-08-24";'
          new_date = 'const REVIEWED_AT = "2026-08-25";'
          old_cursor = '["Anysphere","Cursor","미국","AI 코딩 에이전트|IDE·CLI|코드베이스 편집","https://cursor.com/"]'
          new_cursor = '["Cursor / SpaceX (구 Anysphere)","Cursor · Origin","미국","AI 코딩 에이전트|IDE·CLI|코드베이스 편집|코드 호스팅·저장소·PR|GitHub 동기화","https://cursor.com/"]'
          if old_date not in text:
              raise SystemExit('Expected REVIEWED_AT value not found')
          if old_cursor not in text:
              raise SystemExit('Expected Cursor build row not found')
          text = text.replace(old_date, new_date, 1)
          text = text.replace(old_cursor, new_cursor, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update AI directory review for 2026-08-25"
          git push
