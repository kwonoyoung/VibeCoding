name: Upgrade schoolduty dashboard v2

on:
  push:
    paths:
      - '.github/workflows/upgrade-schoolduty-dashboard-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade dashboard UI only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('schoolduty.html')
          s=p.read_text(encoding='utf-8')
          marker='/* MODERN_DASHBOARD_V2 */'
          if marker not in s:
              css=r'''
/* MODERN_DASHBOARD_V2 */
#dash{--dash-red:#d94b55;--dash-blue:#397bc4;--dash-green:#1d9a6c;--dash-border:#dbe6ec}
#dash .hero{padding-bottom:26px}#dash .hero h1{font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;font-weight:950;letter-spacing:-.045em}.dashboard-intro{display:flex;align-items:center;gap:8px;margin-top:13px;flex-wrap:wrap}.legend-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border:1px solid var(--dash-border);border-radius:999px;background:#fff;color:#5d7180;font-size:10px;font-weight:850}.legend-chip i{width:8px;height:8px;border-radius:50%;display:block}.legend-over i{background:var(--dash-red)}.legend-ok i{background:var(--dash-green)}.legend-low i{background:var(--dash-blue)}
#summaryCards.cards{gap:14px;margin-bottom:18px}.kpi-card{position:relative;overflow:hidden;padding:20px;border:1px solid var(--dash-border);border-radius:18px;background:linear-gradient(145deg,#fff,#f8fbfc);box-shadow:0 12px 30px rgba(13,58,82,.07)}.kpi-card:after{content:"";position:absolute;width:86px;height:86px;border-radius:50%;right:-28px;top:-30px;background:var(--kpi-soft,#edf5f7)}.kpi-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}.kpi-label{font-size:11px;font-weight:850;color:#6a7d89}.kpi-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--kpi-soft,#edf5f7);color:var(--kpi-color,#0b6370);font-size:15px}.kpi-value{position:relative;z-index:1;display:block;margin-top:12px;font-size:29px;font-weight:950;letter-spacing:-.05em;color:#183b4e}.kpi-sub{position:relative;z-index:1;margin-top:4px;color:#81919a;font-size:10px}.kpi-total{--kpi-color:#146b86;--kpi-soft:#e7f3f8}.kpi-avg{--kpi-color:#0f897d;--kpi-soft:#e6f6f3}.kpi-over{--kpi-color:#c8424c;--kpi-soft:#fdecef}.kpi-low{--kpi-color:#3676b9;--kpi-soft:#eaf2fb}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:16px;align-items:start}.dashboard-grid .panel{margin-top:0;height:100%}.panel-modern{padding:20px 21px;border:1px solid var(--dash-border);border-radius:18px;box-shadow:0 12px 32px rgba(18,58,79,.06)}.panel-titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:17px}.panel-titlebar h2{margin:0 0 4px;font-size:17px}.panel-titlebar p{margin:0;color:#7a8b95;font-size:10px;line-height:1.5}.panel-badge{flex:none;padding:6px 9px;border-radius:999px;background:#edf5f7;color:#486979;font-size:10px;font-weight:900}
.modern-bar-row{display:grid;grid-template-columns:88px minmax(130px,1fr) 102px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #edf2f4}.modern-bar-row:last-child{border-bottom:0}.bar-person b{display:block;font-size:12px}.bar-person small{display:block;margin-top:2px;color:#8a9aa3;font-size:9px}.balance-track{position:relative;height:13px;border-radius:999px;background:#edf2f5}.balance-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;min-width:3px}.balance-fill.over{background:linear-gradient(90deg,#ed747c,#d94b55)}.balance-fill.ok{background:linear-gradient(90deg,#43b98c,#1d9a6c)}.balance-fill.low{background:linear-gradient(90deg,#6aa8e8,#397bc4)}.bar-value{text-align:right}.bar-value strong{display:block;font-size:12px}.bar-value small{font-size:9px;font-weight:850}.bar-value .over{color:var(--dash-red)}.bar-value .ok{color:var(--dash-green)}.bar-value .low{color:var(--dash-blue)}.balance-reference{display:flex;justify-content:space-between;gap:8px;margin:4px 0 13px;padding:8px 10px;border-radius:11px;background:#f6f9fa;color:#6f838e;font-size:9px}.balance-reference b{color:#355564}
.field-row{display:grid;grid-template-columns:minmax(90px,1.05fr) minmax(110px,1fr) 52px;gap:9px;align-items:center;padding:7px 0}.field-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:800}.field-track{height:9px;border-radius:999px;background:#edf3f5;overflow:hidden}.field-fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#1c748e,#0c9488)}.field-val{text-align:right;font-size:10px;font-weight:900;color:#456575}
#peopleGrid.people-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.person.balance-card{position:relative;overflow:hidden;padding:19px;border:1px solid var(--dash-border);border-radius:18px;box-shadow:0 10px 28px rgba(15,54,75,.055);border-left:4px solid var(--state-color,#1d9a6c)}.person.balance-card.over{--state-color:var(--dash-red);--state-soft:#fff0f1}.person.balance-card.ok{--state-color:var(--dash-green);--state-soft:#eaf8f2}.person.balance-card.low{--state-color:var(--dash-blue);--state-soft:#edf4fc}.person-role{font-size:14px;font-weight:950}.person-name{margin-top:2px;color:#82939c;font-size:10px}.state-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:999px;background:var(--state-soft);color:var(--state-color);font-size:10px;font-weight:950}.state-badge:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--state-color)}.person-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.person-metric{padding:10px 9px;border-radius:11px;background:#f7fafb}.person-metric small{display:block;color:#84959e;font-size:8px;font-weight:750}.person-metric strong{display:block;margin-top:3px;font-size:12px}.person-progress-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;color:#71858f;font-size:9px}.person-progress{height:9px;border-radius:999px;background:#edf2f5;overflow:hidden}.person-progress i{display:block;height:100%;border-radius:999px;background:var(--state-color)}.person-duties{margin:12px 0 0;padding-top:11px;border-top:1px solid #edf1f3;color:#667c87;font-size:10px;line-height:1.7}.person-name-input{margin-top:12px!important;background:#fbfdfe!important;border-color:#dce7ec!important}
@media(max-width:1100px){.dashboard-grid{grid-template-columns:1fr}}@media(max-width:850px){#peopleGrid.people-grid{grid-template-columns:1fr}.modern-bar-row{grid-template-columns:78px 1fr 80px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){#summaryCards.cards{grid-template-columns:1fr}.modern-bar-row{grid-template-columns:72px 1fr}.bar-value{grid-column:2}.dashboard-intro{display:none}}
'''
              s=s.replace('</style>',css+'\n</style>',1)

          dash_new='''<section id="dash" class="page on"><div class="hero"><div><div class="eyebrow">OVERVIEW · TEAM BALANCE</div><h1>업무 배정의 균형을 한눈에 확인합니다.</h1><p>업무시간과 중요도를 반영한 업무량을 기준으로 평균 대비 ±15% 편차를 실시간 분석합니다.</p><div class="dashboard-intro"><span class="legend-chip legend-over"><i></i>과다 +15% 초과</span><span class="legend-chip legend-ok"><i></i>적정 ±15%</span><span class="legend-chip legend-low"><i></i>여유 -15% 미만</span></div></div><button class="primary" data-go="duties">업무 항목 관리</button></div><div class="cards" id="summaryCards"></div><div class="dashboard-grid"><div class="panel panel-modern"><div class="panel-titlebar"><div><h2>담당자별 업무량 분포</h2><p>전체 평균을 기준으로 담당자별 편차와 상태를 표시합니다.</p></div><span class="panel-badge">TEAM BALANCE</span></div><div id="bars"></div></div><div class="panel panel-modern"><div class="panel-titlebar"><div><h2>업무분야별 업무량</h2><p>업무량이 큰 상위 10개 분야를 비교합니다.</p></div><span class="panel-badge">TOP 10</span></div><div id="fields"></div></div></div></section>'''
          s,n=re.subn(r'<section id="dash" class="page on">.*?</section>\s*<section id="duties"',dash_new+'\n<section id="duties"',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('dash section replacement failed')

          dash_fn=r'''function renderDash(){const s=stats(),assigned=data.duties.filter(d=>activeRoles().includes(d.role)).length,over=s.rs.filter(r=>status(r.total,s.avg)[0]==='과다').length,low=s.rs.filter(r=>status(r.total,s.avg)[0]==='여유').length,maxScale=Math.max(...s.rs.map(r=>r.total),s.avg*1.35,1);$('#summaryCards').innerHTML='<div class="kpi-card kpi-total"><div class="kpi-top"><span class="kpi-label">총 배정된 단위업무 수</span><span class="kpi-icon">▦</span></div><strong class="kpi-value">'+assigned+'<small style="font-size:12px;margin-left:3px">개</small></strong><div class="kpi-sub">현재 활성 담당자에게 배정된 업무</div></div><div class="kpi-card kpi-avg"><div class="kpi-top"><span class="kpi-label">전체 평균 업무량</span><span class="kpi-icon">≈</span></div><strong class="kpi-value">'+s.avg.toFixed(1)+'</strong><div class="kpi-sub">담당자 '+s.rs.length+'명 기준 평균</div></div><div class="kpi-card kpi-over"><div class="kpi-top"><span class="kpi-label">업무 과다 담당자</span><span class="kpi-icon">↑</span></div><strong class="kpi-value">'+over+'<small style="font-size:12px;margin-left:3px">명</small></strong><div class="kpi-sub">평균 대비 +15% 초과</div></div><div class="kpi-card kpi-low"><div class="kpi-top"><span class="kpi-label">업무 여유 담당자</span><span class="kpi-icon">↓</span></div><strong class="kpi-value">'+low+'<small style="font-size:12px;margin-left:3px">명</small></strong><div class="kpi-sub">평균 대비 -15% 미만</div></div>';$('#bars').innerHTML='<div class="balance-reference"><span>여유 기준 <b>'+(s.avg*.85).toFixed(1)+'</b></span><span>평균 <b>'+s.avg.toFixed(1)+'</b></span><span>과다 기준 <b>'+(s.avg*1.15).toFixed(1)+'</b></span></div>'+s.rs.map(r=>{const st=status(r.total,s.avg),cls=st[1]==='over'?'over':st[1]==='low'?'low':'ok',dev=s.avg?((r.total-s.avg)/s.avg*100):0;return'<div class="modern-bar-row"><div class="bar-person"><b>'+r.role+'</b><small>'+esc(data.names[r.role]||'담당자')+' · '+r.count+'개</small></div><div class="balance-track"><i class="balance-fill '+cls+'" style="width:'+Math.min(100,r.total/maxScale*100)+'%"></i></div><div class="bar-value"><strong>'+r.total.toFixed(1)+'</strong><small class="'+cls+'">'+(dev>0?'+':'')+dev.toFixed(1)+'% · '+st[0]+'</small></div></div>'}).join('');const fs={};data.duties.forEach(d=>fs[d.field]=(fs[d.field]||0)+weight(d));const fmax=Math.max(...Object.values(fs),1);$('#fields').innerHTML=Object.entries(fs).sort((a,b)=>b[1]-a[1]).slice(0,10).map(x=>'<div class="field-row"><div class="field-name" title="'+esc(x[0])+'">'+esc(x[0])+'</div><div class="field-track"><i class="field-fill" style="width:'+(x[1]/fmax*100)+'%"></i></div><div class="field-val">'+x[1].toFixed(1)+'</div></div>').join('')}'''
          s,n=re.subn(r'function renderDash\(\)\{.*?\}\nfunction filters',dash_fn+'\nfunction filters',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderDash replacement failed')

          people_fn=r'''function renderPeople(){const s=stats(),maxScale=Math.max(...s.rs.map(r=>r.total),s.avg*1.35,1);$('#peopleGrid').innerHTML=s.rs.map(r=>{const st=status(r.total,s.avg),cls=st[1]==='over'?'over':st[1]==='low'?'low':'ok',dev=s.avg?((r.total-s.avg)/s.avg*100):0,pct=Math.min(100,r.total/maxScale*100);return'<div class="person balance-card '+cls+'"><div class="person-head"><div><div class="person-role">'+r.role+'</div><div class="person-name">'+esc(data.names[r.role]||'성명 미입력')+'</div></div><span class="state-badge">'+st[0]+'</span></div><div class="person-metrics"><div class="person-metric"><small>단위업무</small><strong>'+r.count+'개</strong></div><div class="person-metric"><small>업무량</small><strong>'+r.total.toFixed(1)+'</strong></div><div class="person-metric"><small>평균 편차</small><strong>'+(dev>0?'+':'')+dev.toFixed(1)+'%</strong></div></div><div class="person-progress-head"><span>업무량 수준</span><span>평균 '+s.avg.toFixed(1)+'</span></div><div class="person-progress"><i style="width:'+pct+'%"></i></div><input class="nameInput person-name-input" data-role="'+r.role+'" placeholder="성명 입력" value="'+esc(data.names[r.role]||'')+'"><div class="person-duties">'+r.duties.slice(0,5).map(d=>'• '+esc(d.title)).join('<br>')+(r.count>5?'<br><b>외 '+(r.count-5)+'개 업무</b>':'')+'</div></div>'}).join('')}'''
          s,n=re.subn(r'function renderPeople\(\)\{.*?\}\nfunction renderExport',people_fn+'\nfunction renderExport',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderPeople replacement failed')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit upgraded dashboard
        run: |
          git config user.name "kwonoyoung"
          git config user.email "kwonoyoung77@gmail.com"
          git add schoolduty.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upgrade schoolduty dashboard UI and team balance"
          git push
