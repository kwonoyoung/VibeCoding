name: One-time presentation typography v2

on:
  push:
    paths:
      - '.github/workflows/one-time-presentation-typography-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply typography overrides
        shell: python
        run: |
          from pathlib import Path

          def inject(path, marker, css):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if marker in s:
                  print(f'{path}: already patched')
                  return
              if '</style>' not in s:
                  raise RuntimeError(f'{path}: </style> not found')
              s = s.replace('</style>', f'\n{css}\n</style>', 1)
              p.write_text(s, encoding='utf-8')
              print(f'{path}: patched')

          reorg_css = r'''
    /* 2026-08-27 typography rebalance v2: requested headings smaller, all other text larger */
    /* The nine requested lines are all slide h2 headings. */
    h2{font-size:clamp(32px,3.8vw,48px)!important}
    .top-title{font-size:20px!important}.top-title small{font-size:16px!important}.btn{font-size:18px!important}
    .eyebrow{font-size:20px!important}.cover h1{font-size:clamp(62px,7vw,92px)!important}.cover .lead{font-size:clamp(27px,2.8vw,36px)!important}.pills span{font-size:22px!important}
    .no{font-size:20px!important}.desc{font-size:25px!important}.quote{font-size:clamp(30px,3vw,41px)!important}
    .metric-card .label{font-size:22px!important}.metric-card .from{font-size:40px!important}.metric-card .arrow{font-size:42px!important}.metric-card .to{font-size:68px!important}.metric-card .delta{font-size:20px!important}.metric-card p{font-size:22px!important}
    .time-card .date{font-size:31px!important}.time-card .tag{font-size:18px!important}.time-card b{font-size:25px!important}.time-card p{font-size:21px!important}.struct{font-size:20px!important}
    .staff-box b{font-size:25px!important}.staff-box .value{font-size:56px!important}.staff-box .value span{font-size:27px!important}.staff-box p{font-size:21px!important}.trend h3{font-size:30px!important}.trend-row{font-size:21px!important}.trend-row b{font-size:23px!important}.trend-note{font-size:20px!important}
    .principle .n{font-size:21px!important}.principle b{font-size:25px!important}.principle p{font-size:21px!important}
    .weight b{font-size:25px!important}.weight strong{font-size:32px!important}.weight p{font-size:20.5px!important}
    .finance-stat h3{font-size:31px!important}.people-flow .num{font-size:74px!important}.people-flow .arr{font-size:46px!important}.people-flow small{font-size:19px!important}.cut b{font-size:36px!important}.cut span{font-size:19px!important}.check{font-size:21px!important}.check b{font-size:23px!important}
    .q{font-size:24px!important}.q b{font-size:26px!important}.step b{font-size:23px!important}.step p{font-size:19px!important}.step:after{font-size:31px!important}
    .closing-box h3{font-size:37px!important}.closing-line{font-size:clamp(36px,3.9vw,50px)!important}.speaker{font-size:21px!important}.arrows button{font-size:28px!important}
    @media(max-width:760px){h2{font-size:clamp(29px,8.2vw,38px)!important}.top-title{font-size:15px!important}.btn{font-size:13px!important}.cover h1{font-size:clamp(48px,13vw,66px)!important}.cover .lead{font-size:23px!important}.pills span{font-size:19px!important}.no{font-size:18px!important}.desc{font-size:22px!important}.q{font-size:22px!important}.time-card p,.principle p{font-size:20px!important}.metric-card .to{font-size:56px!important}}
'''

          org_css = r'''
/* 2026-08-27 typography rebalance v2: requested headings smaller, all other text larger */
/* Requested cover title and seven slide h2 headings are reduced. */
.cover h1{font-size:clamp(42px,5.4vw,68px)!important}h2{font-size:clamp(34px,4.1vw,52px)!important}
.top-title{font-size:18px!important}.top-title small{font-size:14px!important}.home-btn,.action-btn{font-size:16px!important}
.eyebrow{font-size:17px!important}.cover .lead{font-size:clamp(23px,2.5vw,31px)!important}.pills span{font-size:19px!important}
.no{font-size:17px!important}.desc{font-size:22px!important}.quote{font-size:clamp(28px,3vw,39px)!important}
.card h3{font-size:25px!important}.card p{font-size:19px!important}.num{font-size:50px!important}
.big .n{font-size:clamp(80px,9.5vw,124px)!important}.big .n small{font-size:33px!important}.big h3{font-size:31px!important}.big p{font-size:21px!important}.caution{font-size:17px!important}
.role b,.support b{font-size:20px!important}.role span,.support span{font-size:17px!important}
.flow b{font-size:23px!important}.flow p{font-size:18.5px!important}.arr{font-size:40px!important}
.formula b{font-size:46px!important}.formula span{font-size:19px!important}.op{font-size:42px!important}
.task{font-size:20px!important}.metric i{font-size:20px!important}.metric b{font-size:22px!important}.metric span{font-size:18px!important}.road b{font-size:21px!important}.road p{font-size:17px!important}
.conbox h3{font-size:32px!important}.side{font-size:24px!important}.side span{font-size:18px!important}.plus{font-size:40px!important}.final{font-size:clamp(31px,3.5vw,43px)!important}.note{font-size:18px!important}.arrows button{font-size:25px!important}
@media(max-width:650px){.cover h1{font-size:clamp(38px,11vw,54px)!important}h2{font-size:clamp(30px,8.2vw,40px)!important}.top-title{font-size:14px!important}.home-btn,.action-btn{font-size:12px!important}.cover .lead{font-size:20px!important}.pills span{font-size:18px!important}.desc{font-size:19px!important}.card p{font-size:17.5px!important}.task{font-size:18px!important}}
'''

          inject('reorganization-presentation.html', 'typography rebalance v2: requested headings smaller', reorg_css)
          inject('organization.html', 'typography rebalance v2: requested headings smaller', org_css)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reorganization-presentation.html organization.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine presentation typography on both pages"
          git push

# trigger: 2026-08-27 v2
