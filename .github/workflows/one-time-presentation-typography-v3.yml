name: One-time presentation typography v3

on:
  push:
    paths:
      - '.github/workflows/one-time-presentation-typography-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Link typography stylesheets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              ('reorganization-presentation.html', 'reorganization-presentation-v3.css?v=20260827-v3'),
              ('organization.html', 'organization-v3.css?v=20260827-v3'),
          ]
          for path, href in targets:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if href in s:
                  print(path, 'already linked')
                  continue
              tag = f'<link rel="stylesheet" href="{href}">'
              if '</head>' not in s:
                  raise RuntimeError(f'{path}: </head> not found')
              s = s.replace('</head>', tag + '\n</head>', 1)
              p.write_text(s, encoding='utf-8')
              print(path, 'linked')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reorganization-presentation.html organization.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Apply typography v3 to both presentations"
          git push
