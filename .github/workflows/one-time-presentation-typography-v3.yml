name: One-time presentation typography v3

on:
  push:
    paths:
      - '.github/workflows/one-time-presentation-typography-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply typography overrides v3
        shell: python {0}
        run: |
          from pathlib import Path

          def inject(path, marker, css):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if marker in s:
                  print(f'{path}: already patched')
                  return
              if '</style>' not in s:
                  raise RuntimeError(f'{path}: </style> not found')
              s = s.replace('</style>', f'\n{css}\n</style>', 1)
              p.write_text(s, encoding='utf-8')
              print(f'{path}: patched')

          reorg_css = r'''
    /* 2026-08-27 typography rebalance v3: requested headings one more step smaller; all other text one more step larger */
    h2{font-size:clamp(28px,3.4vw,44px)!important}
    .top-title{font-size:22px!important}.top-title small{font-size:18px!important}.btn{font-size:20px!important}
    .eyebrow{font-size:22px!important}.cover h1{font-size:clamp(68px,7.4vw,98px)!important}.cover .lead{font-size:clamp(29px,3vw,38px)!important}.pills span{font-size:24px!important}
    .no{font-size:22px!important}.desc{font-size:27px!important}.quote{font-size:clamp(32px,3.2vw,43px)!important}
    .metric-card .label{font-size:24px!important}.metric-card .from{font-size:42px!important}.metric-card .arrow{font-size:44px!important}.metric-card .to{font-size:72px!important}.metric-card .delta{font-size:22px!important}.metric-card p{font-size:24px!important}
    .time-card .date{font-size:33px!important}.time-card .tag{font-size:20px!important}.time-card b{font-size:27px!important}.time-card p{font-size:23px!important}.struct{font-size:22px!important}
    .staff-box b{font-size:27px!important}.staff-box .value{font-size:60px!important}.staff-box .value span{font-size:29px!important}.staff-box p{font-size:23px!important}.trend h3{font-size:32px!important}.trend-row{font-size:23px!important}.trend-row b{font-size:25px!important}.trend-note{font-size:22px!important}
    .principle .n{font-size:23px!important}.principle b{font-size:27px!important}.principle p{font-size:23px!important}
    .weight b{font-size:27px!important}.weight strong{font-size:34px!important}.weight p{font-size:22.5px!important}
    .finance-stat h3{font-size:33px!important}.people-flow .num{font-size:78px!important}.people-flow .arr{font-size:48px!important}.people-flow small{font-size:21px!important}.cut b{font-size:38px!important}.cut span{font-size:21px!important}.check{font-size:23px!important}.check b{font-size:25px!important}
    .q{font-size:26px!important}.q b{font-size:28px!important}.step b{font-size:25px!important}.step p{font-size:21px!important}.step:after{font-size:33px!important}
    .closing-box h3{font-size:39px!important}.closing-line{font-size:clamp(38px,4.1vw,52px)!important}.speaker{font-size:23px!important}.arrows button{font-size:30px!important}
    @media(max-width:760px){h2{font-size:clamp(26px,7.6vw,35px)!important}.top-title{font-size:16px!important}.btn{font-size:14px!important}.cover h1{font-size:clamp(52px,13.5vw,70px)!important}.cover .lead{font-size:25px!important}.pills span{font-size:21px!important}.no{font-size:20px!important}.desc{font-size:24px!important}.q{font-size:24px!important}.time-card p,.principle p{font-size:22px!important}.metric-card .to{font-size:60px!important}}
'''

          org_css = r'''
/* 2026-08-27 typography rebalance v3: requested headings one more step smaller; all other text one more step larger */
.cover h1{font-size:clamp(38px,5vw,62px)!important}h2{font-size:clamp(30px,3.7vw,46px)!important}
.top-title{font-size:20px!important}.top-title small{font-size:16px!important}.home-btn,.action-btn{font-size:18px!important}
.eyebrow{font-size:19px!important}.cover .lead{font-size:clamp(25px,2.7vw,33px)!important}.pills span{font-size:21px!important}
.no{font-size:19px!important}.desc{font-size:24px!important}.quote{font-size:clamp(30px,3.2vw,41px)!important}
.card h3{font-size:27px!important}.card p{font-size:21px!important}.num{font-size:54px!important}
.big .n{font-size:clamp(84px,9.8vw,128px)!important}.big .n small{font-size:35px!important}.big h3{font-size:33px!important}.big p{font-size:23px!important}.caution{font-size:19px!important}
.role b,.support b{font-size:22px!important}.role span,.support span{font-size:19px!important}
.flow b{font-size:25px!important}.flow p{font-size:20.5px!important}.arr{font-size:42px!important}
.formula b{font-size:50px!important}.formula span{font-size:21px!important}.op{font-size:44px!important}
.task{font-size:21px!important}.metric i{font-size:22px!important}.metric b{font-size:24px!important}.metric span{font-size:20px!important}.road b{font-size:23px!important}.road p{font-size:19px!important}
.conbox h3{font-size:34px!important}.side{font-size:26px!important}.side span{font-size:20px!important}.plus{font-size:42px!important}.final{font-size:clamp(33px,3.7vw,45px)!important}.note{font-size:20px!important}.arrows button{font-size:27px!important}
@media(max-width:650px){.cover h1{font-size:clamp(34px,10vw,48px)!important}h2{font-size:clamp(27px,7.6vw,36px)!important}.top-title{font-size:15px!important}.home-btn,.action-btn{font-size:13px!important}.cover .lead{font-size:22px!important}.pills span{font-size:20px!important}.desc{font-size:21px!important}.card p{font-size:19px!important}.task{font-size:19px!important}}
'''

          inject('reorganization-presentation.html', 'typography rebalance v3:', reorg_css)
          inject('organization.html', 'typography rebalance v3:', org_css)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reorganization-presentation.html organization.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Increase presentation typography contrast again"
          git push
