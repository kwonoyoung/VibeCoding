<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173d70">
  <title>2026년 신규예정공무원 보수 교육</title>
  <style>
    :root{--navy:#173d70;--blue:#2868a8;--paper:#fff;--muted:#dbe7f4}*{box-sizing:border-box}
    html,body{height:100%;margin:0}body{overflow:hidden;background:#122033;color:#fff;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}
    .app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;background:linear-gradient(135deg,#102d52,#1d568b);box-shadow:0 4px 18px #0005;z-index:3}.title{min-width:0}.title strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;margin-top:2px;color:#bed6ef;font-size:11px}.actions{display:flex;gap:7px}.btn{border:1px solid #ffffff40;border-radius:10px;background:#ffffff16;color:#fff;padding:8px 11px;font-weight:800;cursor:pointer}.btn:hover{background:#ffffff28}.stage{position:relative;min-height:0;display:grid;place-items:center;padding:14px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#27486b,#101b29 70%)}
    .slide{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:var(--paper);box-shadow:0 18px 50px #0009;object-fit:contain}.loading{position:absolute;color:#c8d9e9;font-size:14px}.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:#0d1926;border-top:1px solid #ffffff16}.nav{width:42px;height:38px;border:0;border-radius:10px;background:#2b5f91;color:#fff;font-size:20px;font-weight:900;cursor:pointer}.nav:disabled{opacity:.35;cursor:not-allowed}.counter{min-width:92px;text-align:center;font-size:14px;font-weight:800}.progress{width:min(360px,35vw);height:6px;border-radius:9px;background:#ffffff20;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#77b8ef;transition:width .2s}
    .home{position:fixed;right:20px;bottom:20px;z-index:9;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:#fff;color:var(--navy);text-decoration:none;font-size:23px;box-shadow:0 8px 24px #0007;border:2px solid #d9e8f5}.home:hover{transform:translateY(-2px)}
    @media(max-width:640px){.bar{padding:9px 12px}.title strong{font-size:13px}.title span{display:none}.actions .label{display:none}.stage{padding:7px}.progress{display:none}.home{right:12px;bottom:12px;width:48px;height:48px}.controls{padding-right:70px}}
    @media print{.bar,.controls,.home{display:none}.app{display:block}.stage{padding:0;background:#fff}.slide{width:100%;max-height:none;box-shadow:none}}
  </style>
</head>
<body>
  <main class="app">
    <header class="bar"><div class="title"><strong>2026년 신규예정공무원 보수 교육</strong><span>공무원 보수(기본) · 총 14쪽</span></div><div class="actions"><button class="btn" id="fit" title="화면 맞춤">↕ <span class="label">화면 맞춤</span></button><button class="btn" id="full" title="전체 화면">⛶ <span class="label">전체 화면</span></button></div></header>
    <section class="stage" id="stage"><div class="loading" id="loading">발표자료를 불러오는 중입니다.</div><img class="slide" id="slide" alt="공무원 보수 교육 발표자료 1쪽"></section>
    <footer class="controls"><button class="nav" id="prev" aria-label="이전 페이지">‹</button><div class="counter"><span id="current">1</span> / 14</div><div class="progress"><i id="progress"></i></div><button class="nav" id="next" aria-label="다음 페이지">›</button></footer>
  </main>
  <a class="home" href="https://kwonoyoung.github.io/VibeCoding/index.html" aria-label="홈으로 이동" title="홈으로">⌂</a>
  <script>
    const total=14,img=document.getElementById('slide'),loading=document.getElementById('loading'),current=document.getElementById('current'),progress=document.getElementById('progress'),prev=document.getElementById('prev'),next=document.getElementById('next'),stage=document.getElementById('stage');let page=1,fitWidth=false;
    const src=n=>`edupay-pages/edupay-${String(n).padStart(2,'0')}.jpg`;
    function show(n){page=Math.max(1,Math.min(total,n));loading.hidden=false;img.src=src(page);img.alt=`공무원 보수 교육 발표자료 ${page}쪽`;current.textContent=page;progress.style.width=`${page/total*100}%`;prev.disabled=page===1;next.disabled=page===total;history.replaceState(null,'',`#page=${page}`);[page-1,page+1].filter(x=>x>0&&x<=total).forEach(x=>{const p=new Image;p.src=src(x)})}
    img.onload=()=>loading.hidden=true;img.onerror=()=>loading.textContent='페이지 이미지를 불러오지 못했습니다.';prev.onclick=()=>show(page-1);next.onclick=()=>show(page+1);
    document.getElementById('fit').onclick=()=>{fitWidth=!fitWidth;img.style.width=fitWidth?'100%':'auto';img.style.maxHeight=fitWidth?'none':'100%';stage.style.overflow=fitWidth?'auto':'hidden'};
    document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(page+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(page-1)}if(e.key==='Home')show(1);if(e.key==='End')show(total)});let x=0;stage.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});stage.addEventListener('touchend',e=>{const d=e.changedTouches[0].screenX-x;if(Math.abs(d)>50)show(page+(d<0?1:-1))},{passive:true});
    const initial=Number(location.hash.match(/page=(\d+)/)?.[1]||1);show(initial);
  </script>
</body>
</html>
