<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기간제교원 퇴직금 자동 계산</title>
<style>
html,body{margin:0;padding:0;background:#f3f5f9;font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;color:#64748b}
#appFrame{display:block;width:100%;border:0;min-height:100vh;background:#f3f5f9}
.footer-credit{width:100%;box-sizing:border-box;text-align:center;padding:22px 16px 28px;font-size:13px;font-weight:700;letter-spacing:.02em;color:#7b8794;background:#f3f5f9}
@media(max-width:700px){.footer-credit{font-size:12px;padding:18px 12px 24px}}
</style>
</head>
<body>
<iframe id="appFrame" src="tea-core.html" title="기간제교원 퇴직금 자동 계산"></iframe>
<footer class="footer-credit">Program by Kwon O Young.</footer>
<script>
(function(){
 const f=document.getElementById('appFrame');
 function fit(){
   try{
     const d=f.contentDocument||f.contentWindow.document;
     const h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0,window.innerHeight-60);
     f.style.height=h+'px';
   }catch(e){f.style.height='calc(100vh - 60px)';}
 }
 f.addEventListener('load',function(){
   fit();
   try{
     const d=f.contentDocument||f.contentWindow.document;
     if(window.ResizeObserver){new ResizeObserver(fit).observe(d.documentElement);}
     const mo=new MutationObserver(function(){setTimeout(fit,50)});
     mo.observe(d.documentElement,{subtree:true,childList:true,attributes:true,characterData:false});
   }catch(e){}
   setTimeout(fit,300);setTimeout(fit,1000);
 });
 window.addEventListener('resize',fit);
})();
</script>
</body>
</html>
