mary small{color:#8b857e}.person-name{height:34px;min-width:110px;padding:0 9px;border:1px solid #ddd8cf;border-radius:8px;font:inherit;font-size:11px}.export-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.export-card{padding:22px}.export-card h3{margin:0;font-family:"Noto Serif KR",serif;font-size:17px}.export-card p{min-height:36px;margin:8px 0 16px;color:#77736c;font-size:11px;line-height:1.65}.print-preview{margin-top:16px;padding:26px}.print-preview h2{margin:0;text-align:center;font-family:"Noto Serif KR",serif}.print-preview .meta{margin:8px 0 18px;text-align:center;color:#78716c;font-size:11px}.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.form-card{padding:22px}.form-card h3{margin:0 0 16px;font-family:"Noto Serif KR",serif;font-size:17px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;font-size:11px;font-weight:900;color:#57534e}.field-note{padding:15px;border-radius:10px;background:#f6f4ef;color:#77736c;font-size:11px;line-height:1.7}.manual-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.manual-card{padding:22px}.manual-card .num{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:#dff7f2;color:#0f766e;font-weight:900}.manual-card h3{margin:12px 0 7px;font-family:"Noto Serif KR",serif;font-size:16px}.manual-card p{margin:0;color:#77736c;font-size:11px;line-height:1.75}.modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;background:rgba(28,25,23,.42);backdrop-filter:blur(3px)}.modal.show{display:grid}.modal-box{width:min(560px,100%);padding:24px;border-radius:16px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.22)}.modal-box h3{margin:0 0 18px;font-family:"Noto Serif KR",serif}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-grid .wide{grid-column:1/3}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.empty{padding:34px;text-align:center;color:#99928a}.toast{position:fixed;right:24px;bottom:24px;z-index:120;padding:11px 15px;border-radius:10px;background:#1f4e49;color:#fff;font-size:11px;font-weight:800;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:1050px){.overview-grid,.dash-lower{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.field-list{grid-template-columns:1fr}}@media(max-width:780px){.sidebar{transform:translateX(-100%);transition:.22s}.sidebar.open{transform:none}.main{margin-left:0}.mobile-menu{display:block}.topbar{padding:12px 16px}.content{padding:24px 16px 60px}.home-link{display:none}.hero{grid-template-columns:1fr}.metrics,.people-summary,.export-grid,.settings-grid,.manual-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.modal-grid{grid-template-columns:1fr}.modal-grid .wide{grid-column:auto}}@media print{.sidebar,.topbar,.no-print,.toast{display:none!important}.main{margin:0}.content{padding:0}.page{display:none!important}.page.print-target{display:block!important}.card,.table-wrap{box-shadow:none;border-color:#bbb}.print-preview{border:0}.table{min-width:0;font-size:9px}.table th,.table td{padding:6px}}

<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="logo"><div class="logo-mark">▦</div><div><strong>업무분장 관리</strong><small>SCHOOL ADMINISTRATION</small></div></div>
      <div class="nav-title">업무분장 관리</div>
      <nav class="nav" id="nav">
        <button class="on" data-page="dash"><span class="ico">◫</span>업무 대시보드</button>
        <button data-page="duties"><span class="ico">≡</span>업무 관리</button>
        <button data-page="people"><span class="ico">♙</span>담당자 현황</button>
        <button data-page="export"><span class="ico">⇩</span>출력 · 내보내기</button>
        <button data-page="settings"><span class="ico">⚙</span>학교 기본설정</button>
        <button data-page="guide"><span class="ico">?</span>사용 매뉴얼</button>
      </nav>
      <div class="side-note"><b>현재 브라우저에 자동 보관</b><p>공유 전에는 JSON 백업 파일을 저장하세요.</p></div>
    </aside>
    <main class="main">
      <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="mobile-menu" id="mobileMenu">☰</button><div><div class="top-meta" id="topMeta"></div><div class="top-school" id="topSchool"></div></div></div><div class="top-actions"><span class="saved" id="saved">저장됨</span><a class="home-link" href="index.html">⌂ 오춘기 권오영 홈</a></div></header>
      <div class="content">
        <section class="page on" id="dash"></section>
        <section class="page" id="duties"></section>
        <section class="page" id="people"></section>
        <section class="page" id="export"></section>
        <section class="page" id="settings"></section>
        <section class="page" id="guide"></section>
      </div>
    </main>
  </div>
  <div class="modal" id="dutyModal"><div class="modal-box"><h3 id="modalTitle">업무 항목</h3><div class="modal-grid"><div class="field"><label>업무분야</label><input class="input" id="mCategory"></div><div class="field"><label>담당자</label><select class="select" id="mAssignee"></select></div><div class="field wide"><label>단위업무</label><input class="input" id="mTask"></div><div class="field"><label>업무시간 (1~10)</label><input class="input" id="mTime" type="number" min="1" max="10"></div><div class="field"><label>중요도 (1~10)</label><input class="input" id="mImportance" type="number" min="1" max="10"></div><div class="field wide"><label>메모</label><input class="input" id="mMemo"></div></div><div class="modal-actions"><button class="btn btn-muted" id="modalCancel">취소</button><button class="btn btn-primary" id="modalSave">저장</button></div></div></div>
  <input type="file" id="restoreFile" accept="application/json,.json" hidden>
  <div class="toast" id="toast"></div>
  <script>

    const baseState=()=>({settings:{school:'남원여자고등학교',grade:'고등학교',staff:6,date:'2021-01-07',mode:'표준안'},names:{},duties:structuredClone(DEFAULT_DUTIES)});
    let state=load(); let editId=null; let currentPage='dash';
    function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.duties&&v.settings)return v}catch(e){}return baseState()}
    function save(msg){localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saved').textContent='저장됨';if(msg)toast(msg);renderTop()}
    function roles(){const n=Math.max(2,Math.min(9,Number(state.settings.staff)||6));return ['실장',...Array.from({length:n-1},(_,i)=>'주무관'+(i+1))]}
    function workload(d){return Number((Number(d.time)*Number(d.importance)/10).toFixed(1))}
    function stats(){const rs=roles();const rows=rs.map(role=>{const ds=state.duties.filter(d=>d.assignee===role);return{role,count:ds.length,amount:Number(ds.reduce((a,d)=>a+workload(d),0).toFixed(1)),duties:ds}});const total=Number(rows.reduce((a,r)=>a+r.amount,0).toFixed(1));const avg=rows.length?total/rows.length:0;rows.forEach(r=>r.status=r.amount>avg*1.15?'과다':r.amount<avg*.85?'여유':'적정');const mad=rows.length?rows.reduce((a,r)=>a+Math.abs(r.amount-avg),0)/rows.length:0;const score=avg?Math.max(0,Math.min(100,Math.round(100-(mad/avg*100)))):100;return{rows,total,avg,score,max:rows.reduce((a,b)=>a.amount>b.amount?a:b,rows[0]||{amount:0,role:'-'}),min:rows.reduce((a,b)=>a.amount<b.amount?a:b,rows[0]||{amount:0,role:'-'})}}
    function fieldStats(){const m={};state.duties.forEach(d=>m[d.category]=(m[d.category]||0)+workload(d));return Object.entries(m).map(([name,amount])=>({name,amount:Number(amount.toFixed(1))})).sort((a,b)=>b.amount-a.amount)}

    function renderDash(){const s=stats(),fields=fieldStats(),mx=Math.max(...s.rows.map(r=>r.amount),1),fm=Math.max(...fields.map(f=>f.amount),1);const over=s.rows.filter(r=>r.status==='과다').length;document.getElementById('dash').innerHTML=`
      <div class="hero"><div><div class="kicker">OVERVIEW · ${state.settings.date?state.settings.date.slice(0,4):'기준일 미설정'}</div><h1>업무 배정의 균형을 확인합니다.</h1><p>${state.settings.date||'기준일 미설정'} 기준 · 원본 엑셀에서 이관한 ${state.duties.length}개 단위업무</p></div><div class="actions no-print"><button class="btn btn-primary" onclick="go('duties')">업무 항목 관리</button></div></div>
      <div class="overview-grid"><div class="card balance-card"><div class="doc-kicker">CURRENT BALANCE</div><div class="balance-score"><strong>${s.score}</strong><span>점 · 업무량 균형 지수</span></div><p>업무시간과 중요도를 함께 반영해 계산한 업무량을 기준으로 평균 대비 ±15% 안의 배정을 적정으로 표시합니다.</p><div class="actions no-print" style="margin-top:16px"><button class="btn btn-primary" onclick="go('people')">담당자별 편차 보기</button><button class="btn btn-muted" onclick="printDuty()">업무분장표 출력</button></div></div><div class="card summary-card"><div class="doc-kicker">균형 점검 요약</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:14px"><span class="big">${over}건</span>${statusChip(over?'과다':'적정')}</div><div class="sub">평균 업무량 ${s.avg.toFixed(1)} · ${s.max.role}이(가) 가장 많은 업무량을 보유합니다.</div></div></div>
      <div class="metrics"><div class="card metric"><div class="label">총 업무량</div><div class="value">${s.total.toFixed(1)}</div><div class="hint">가중 업무량</div><div class="foot">업무시간 × 중요도 ÷ 10</div></div><div class="card metric"><div class="label">관리 업무</div><div class="value">${state.duties.length}</div><div class="hint">개 단위업무</div><div class="foot">${fields.length}개 업무분야</div></div><div class="card metric"><div class="label">배정 담당자</div><div class="value">${roles().length}</div><div class="hint">명 활성</div><div class="foot">전체 ${roles().length}개 역할</div></div><div class="card metric"><div class="label">집중 담당자</div><div class="value">${s.max.role}</div><div class="hint">${s.max.amount.toFixed(1)} 업무량</div><div class="foot">현재 가장 높은 업무량</div></div></div>

    function renderDuties(){const cats=[...new Set(state.duties.map(d=>d.category))];const rs=roles();document.getElementById('duties').innerHTML=`<div class="hero"><div><div class="kicker">DUTY REGISTER</div><h1>업무를 배정하고 조정합니다.</h1><p>단위업무의 업무시간·중요도를 바꾸면 담당자별 업무량과 균형 지수가 즉시 갱신됩니다.</p></div><button class="btn btn-primary no-print" onclick="openDuty()">+ 업무 추가</button></div><div class="filters no-print"><input class="input" id="dutySearch" placeholder="업무분야, 단위업무, 담당자 검색"><select class="select" id="catFilter"><option value="">전체 분야</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select class="select" id="roleFilter"><option value="">전체 담당자</option>${rs.map(r=>`<option>${r}</option>`).join('')}</select></div><div class="table-wrap"><table class="table"><thead><tr><th>순번</th><th>업무분야</th><th>단위업무</th><th>업무시간</th><th>중요도</th><th>업무량</th><th>담당자</th><th>메모</th><th class="no-print">관리</th></tr></thead><tbody id="dutyBody"></tbody></table></div>`;['dutySearch','catFilter','roleFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='dutySearch'?'input':'change',renderDutyRows));renderDutyRows()}
    function renderDutyRows(){const q=(document.getElementById('dutySearch')?.value||'').trim().toLowerCase(),cat=document.getElementById('catFilter')?.value||'',role=document.getElementById('roleFilter')?.value||'';const list=state.duties.filter(d=>(!q||`${d.category} ${d.task} ${d.assignee}`.toLowerCase().includes(q))&&(!cat||d.category===cat)&&(!role||d.assignee===role));document.getElementById('dutyBody').innerHTML=list.length?list.map((d,i)=>`<tr><td>${i+1}</td><td>${esc(d.category)}</td><td><b>${esc(d.task)}</b></td><td>${d.time}</td><td>${d.importance}</td><td class="workload">${workload(d).toFixed(1)}</td><td>${d.assignee}</td><td>${esc(d.memo||'')}</td><td class="no-print"><div class="row-actions"><button class="tiny" onclick="openDuty(${d.id})">수정</button><button class="tiny" onclick="deleteDuty(${d.id})">삭제</button></div></td></tr>`).join(''):`<tr><td colspan="9" class="empty">조건에 맞는 업무 항목이 없습니다.</td></tr>`}
    function renderPeople(){const s=stats(),mx=Math.max(...s.rows.map(r=>r.amount),1);document.getElementById('people').innerHTML=`<div class="hero"><div><div class="kicker">ASSIGNEE STATUS</div><h1>담당자별 업무 편차를 검토합니다.</h1><p>평균 업무량을 기준으로 각 담당자의 배정 상태를 확인하고, 담당자 성명을 입력해 출력물에 반영하세요.</p></div></div><div class="people-summary"><div class="card"><small>최대 업무량</small><b>${s.max.amount.toFixed(1)}</b><small>${s.max.role} · 현재 가장 높은 가중 업무량</small></div><div class="card"><small>최소 업무량</small><b>${s.min.amount.toFixed(1)}</b><small>${s.min.role} · 현재 가장 낮은 가중 업무량</small></div><div class="card"><small>적정 기준</small><b>±15%</b><small>평균 업무량 ${s.avg.toFixed(1)} 기준</small></div></div><div class="table-wrap"><table class="table"><thead><tr><th>역할 / 성명</th><th>업무량 분포</th><th>업무량</th><th>업무 수</th><th>비중</th><th>배정 상태</th><th>배정 업무</th></tr></thead><tbody>${s.rows.map(r=>`<tr><td><b>${r.role}</b><br><input class="person-name" value="${esc(state.names[r.role]||'')}" placeholder="성명 입력" onchange="setName('${r.role}',this.value)"></td><td><div class="bar-track" style="min-width:160px"><div class="bar-fill" style="width:${r.amount/mx*100}%"></div></div></td><td class="workload">${r.amount.toFixed(1)}</td><td>${r.count}</td><td>${s.total?(r.amount/s.total*100).toFixed(1):'0.0'}%</td><td>${statusChip(r.status)}</td><td>${r.duties.slice(0,3).map(d=>esc(d.task)).join('<br>')}${r.duties.length>3?`<br><span style="color:#999">외 ${r.duties.length-3}건</span>`:''}</td></tr>`).join('')}</tbody></table></div>`}
    function renderExport(){document.getElementById('export').innerHTML=`<div class="hero"><div><div class="kicker">PRINT & EXPORT</div><h1>업무분장표를 출력하고 보관합니다.</h1><p>Excel 내보내기와 JSON 백업·복원을 통해 현재 작업 내용을 안전하게 보관할 수 있습니다.</p></div></div><div class="export-grid no-print"><div class="card export-card"><h3>업무분장표 인쇄</h3><p>학교명과 담당자 성명을 반영한 업무분장표를 인쇄합니다.</p><button class="btn btn-primary" onclick="printDuty()">인쇄 미리보기</button></div><div class="card export-card"><h3>엑셀로 내려받기</h3><p>전체 단위업무를 Excel 통합문서(.xlsx) 파일로 저장합니다.</p><button class="btn btn-muted" onclick="downloadXLSX()">엑셀 저장 (.xlsx)</button></div><div class="card export-card"><h3>JSON 안전 백업</h3><p>학교 설정, 담당자 성명, 업무 배정 전체를 하나의 백업 파일로 저장합니다.</p><button class="btn btn-muted" onclick="backupJSON()">백업 저장</button></div><div class="card export-card"><h3>백업 파일 검증·복원</h3><p>이 페이지에서 만든 JSON 백업 파일을 불러와 현재 상태를 복원합니다.</p><button class="btn btn-muted" onclick="document.getElementById('restoreFile').click()">파일 선택</button></div><div class="card export-card"><h3>원본으로 되돌리기</h3><p>현재 내용을 지우고 원본 엑셀 기준 데이터로 되돌립니다.</p><button class="btn btn-danger" onclick="resetAll()">초기화</button></div></div><div class="card print-preview" id="printPreview"></div>`;renderPrintPreview()}
    function renderPrintPreview(){const box=document.getElementById('printPreview');if(!box)return;box.innerHTML=`<h2>${esc(state.settings.school||'학교명 미입력')} 업무분장표</h2><div class="meta">${esc(state.settings.grade)} · 행정인원 ${state.settings.staff}명 · 작성 기준일 ${state.settings.date||'-'}</div><div class="table-wrap"><table class="table" style="min-width:780px"><thead><tr><th>업무분야</th><th>단위업무</th><th>담당자</th><th>성명</th><th>업무량</th></tr></thead><tbody>${state.duties.map(d=>`<tr><td>${esc(d.category)}</td><td>${esc(d.task)}</td><td>${d.assignee}</td><td>${esc(state.names[d.assignee]||'')}</td><td>${workload(d).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`}
    function renderSettings(){document.getElementById('settings').innerHTML=`<div class="hero"><div><div class="kicker">SCHOOL SETTINGS</div><h1>학교 기본설정을 구성합니다.</h1><p>학교명·학교급·행정인원과 업무분장 방식을 먼저 설정하면 대시보드와 출력물에 즉시 반영됩니다.</p></div><button class="btn btn-primary no-print" onclick="saveSettings()">설정 저장</button></div><div class="settings-grid"><div class="card form-card"><h3>기본 정보</h3><div class="field"><label>학교명</label><input class="input" id="sSchool" value="${esc(state.settings.school)}" placeholder="학교명을 입력하세요"></div><div class="field"><label>학교급</label><select class="select" id="sGrade">${['유치원','초등학교','중학교','고등학교','특수학교'].map(x=>`<option ${x===state.settings.grade?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>행정인원</label><select class="select" id="sStaff">${Array.from({length:8},(_,i)=>i+2).map(n=>`<option value="${n}" ${n==state.settings.staff?'selected':''}>${n}명</option>`).join('')}</select></div><div class="field"><label>작성 기준일</label><input class="input" id="sDate" type="date" value="${state.settings.date||''}"></div></div><div class="card form-card"><h3>업무분장 방식</h3><div class="field"><label>적용 방식</label><select class="select" id="sMode"><option ${state.settings.mode==='표준안'?'selected':''}>표준안</option><option ${state.settings.mode==='사용자 선택'?'selected':''}>사용자 선택</option></select></div><div class="field-note">학교명·학교급·행정인원은 상단 상태 정보, 대시보드, 인쇄 미리보기, Excel/JSON 백업 데이터에 함께 저장됩니다. 행정인원을 줄이면 범위를 벗어난 담당 업무는 마지막 주무관에게 자동 배정됩니다.</div></div></div>`}
    function renderGuide(){document.getElementById('guide').innerHTML=`<div class="hero"><div><div class="kicker">USER GUIDE</div><h1>업무분장 관리 사용 방법</h1><p>원본 엑셀에서 이관한 업무를 기준으로 배정 상태를 조정하고 출력·백업하는 순서입니다.</p></div></div><div class="manual-grid"><div class="card manual-card"><div class="num">1</div><h3>학교 기본설정</h3><p>학교명, 학교급, 행정인원, 작성 기준일을 먼저 입력합니다. 설정 내용은 모든 화면과 출력물에 함께 반영됩니다.</p></div><div class="card manual-card"><div class="num">2</div><h3>업무 관리</h3><p>업무시간과 중요도를 1~10 범위로 조정하고 담당자를 지정합니다. 업무량은 업무시간 × 중요도 ÷ 10으로 계산됩니다.</p></div><div class="card manual-card"><div class="num">3</div><h3>균형 점검</h3><p>담당자별 평균 업무량 대비 ±15%를 적정 범위로 보고 과다·적정·여유 상태를 확인합니다.</p></div><div class="card manual-card"><div class="num">4</div><h3>담당자 성명 입력</h3><p>담당자 현황에서 실제 성명을 입력하면 인쇄용 업무분장표에 역할과 성명이 함께 표시됩니다.</p></div><div class="card manual-card"><div class="num">5</div><h3>출력과 백업</h3><p>최종 배정 후 인쇄하거나 Excel(.xlsx)로 내려받고, 다른 PC로 옮길 때는 JSON 안전 백업 파일을 사용합니다.</p></div><div class="card manual-card"><div class="num">6</div><h3>자동 보관</h3><p>변경 내용은 현재 브라우저의 localStorage에 자동 저장됩니다. 브라우저 초기화 전에는 JSON 백업을 권장합니다.</p></div></div>`}
    function renderAll(){renderTop();renderDash();renderDuties();renderPeople();renderExport();renderSettings();renderGuide()}
    function go(id){currentPage=id;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id));document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===id));document.getElementById('sidebar').classList.remove('open');if(id==='export')renderPrintPreview();window.scrollTo({top:0,behavior:'smooth'})}
    document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
    function openDuty(id){editId=id||null;const d=id?state.duties.find(x=>x.id===id):{category:'일반행정',task:'',time:1,importance:1,assignee:roles()[0],memo:''};document.getElementById('modalTitle').textContent=id?'업무 수정':'새 업무 추가';document.getElementById('mCategory').value=d.category;document.getElementById('mTask').value=d.task;document.getElementById('mTime').value=d.time;document.getElementById('mImportance').value=d.importance;document.getElementById('mMemo').value=d.memo||'';document.getElementById('mAssignee').innerHTML=roles().map(r=>`<option ${r===d.assignee?'selected':''}>${r}</option>`).join('');document.getElementById('dutyModal').classList.add('show')}
    document.getElementById('modalCancel').onclick=()=>document.getElementById('dutyModal').classList.remove('show');document.getElementById('dutyModal').addEventListener('click',e=>{if(e.target.id==='dutyModal')e.currentTarget.classList.remove('show')});document.getElementById('modalSave').onclick=()=>{const obj={category:document.getElementById('mCategory').value.trim(),task:document.getElementById('mTask').value.trim(),time:Math.max(1,Math.min(10,Number(document.getElementById('mTime').value)||1)),importance:Math.max(1,Math.min(10,Number(document.getElementById('mImportance').value)||1)),assignee:document.getElementById('mAssignee').value,memo:document.getElementById('mMemo').value.trim()};if(!obj.category||!obj.task)return toast('업무분야와 단위업무를 입력해 주세요.');if(editId){const d=state.duties.find(x=>x.id===editId);Object.assign(d,obj)}else state.duties.push({id:Math.max(0,...state.duties.map(d=>d.id))+1,...obj});document.getElementById('dutyModal').classList.remove('show');save(editId?'업무 항목을 수정했습니다.':'새 업무 항목을 추가했습니다.');renderAll();go('duties')}
    function deleteDuty(id){if(!confirm('이 업무 항목을 삭제하시겠습니까?'))return;state.duties=state.duties.filter(d=>d.id!==id);save('업무 항목을 삭제했습니다.');renderAll();go('duties')}
    function setName(role,v){state.names[role]=v;save()}
    function saveSettings(){const oldRoles=roles();state.settings.school=document.getElementById('sSchool').value.trim();state.settings.grade=document.getElementById('sGrade').value;state.settings.staff=Number(document.getElementById('sStaff').value);state.settings.date=document.getElementById('sDate').value;state.settings.mode=document.getElementById('sMode').value;const newRoles=roles(),last=newRoles[newRoles.length-1];state.duties.forEach(d=>{if(!newRoles.includes(d.assignee))d.assignee=last});Object.keys(state.names).forEach(k=>{if(!newRoles.includes(k))delete state.names[k]});save('사용자 선택 설정을 저장했습니다.');renderAll();go('settings')}
    function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
    function downloadXLSX(){
      if(typeof XLSX==='undefined'){toast('엑셀 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.');return}
      const head=['순번','업무분야','단위업무','업무시간','중요도','업무량','담당자','성명','메모'];
      const rows=state.duties.map((d,i)=>[i+1,d.category,d.task,Number(d.time),Number(d.importance),Number(workload(d).toFixed(1)),d.assignee,state.names[d.assignee]||'',d.memo||'']);
      const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
      ws['!cols']=[{wch:7},{wch:18},{wch:38},{wch:10},{wch:10},{wch:10},{wch:12},{wch:12},{wch:30}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,'업무분장표');
      XLSX.writeFile(wb,'업무분장표.xlsx',{compression:true});
      toast('엑셀(.xlsx) 파일을 내려받았습니다.');
    }
    function backupJSON(){download('업무분장_백업.json',JSON.stringify({type:'schoolduty-backup',version:1,...state},null,2),'application/json');toast('현재 데이터를 백업했습니다.')}
    document.getElementById('restoreFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(v.type!=='schoolduty-backup'||!Array.isArray(v.duties)||!v.settings)throw new Error();state={settings:v.settings,names:v.names||{},duties:v.duties};save('백업 파일을 복원했습니다.');renderAll();go('export')}catch(err){toast('올바른 업무분장 백업 파일이 아닙니다.')}e.target.value=''})
    function resetAll(){if(!confirm('현재 내용을 지우고 원본 엑셀 기준 데이터로 되돌리시겠습니까?'))return;state=baseState();save('원본 엑셀 데이터 기준으로 복원했습니다.');renderAll();go('dash')}
    function printDuty(){renderExport();go('export');document.getElementById('export').classList.add('print-target');setTimeout(()=>{window.print();document.getElementById('export').classList.remove('print-target')},120)}
    renderAll();go('dash');
  </script>
</body>
</html>
